<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间圣殿 | 人生开放系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600;900&display=block" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <script src="common.js"></script>
    <style>
        /* 页面特有样式 - 时间圣殿主题 */
        .sanctum-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: calc(100vh - 80px);
            margin-top: 80px;
            position: relative;
            z-index: 1;
        }

        /* 左侧卷轴库 */
        .scroll-archive {
            background: var(--bg-panel);
            border-right: 1px solid var(--border-gold);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .archive-header {
            padding: 24px 20px 16px;
            border-bottom: 1px solid var(--border-gold);
        }

        .archive-title {
            font-family: var(--font-display);
            font-size: 14px;
            letter-spacing: 3px;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .archive-title::before {
            content: '📜';
            font-size: 16px;
        }

        .archive-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            padding-left: 26px;
        }

        .scroll-collection {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .landmark-tome {
            margin-bottom: 16px;
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .landmark-tome:hover {
            border-color: rgba(201, 162, 39, 0.3);
        }

        .tome-header {
            padding: 12px 14px;
            background: rgba(201, 162, 39, 0.05);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .tome-header:hover {
            background: rgba(201, 162, 39, 0.1);
        }

        .tome-title {
            font-family: var(--font-display);
            font-size: 13px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tome-toggle {
            color: var(--text-secondary);
            font-size: 12px;
            transition: transform 0.3s ease;
        }

        .landmark-tome.collapsed .tome-toggle {
            transform: rotate(-90deg);
        }

        .tome-content {
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .landmark-tome.collapsed .tome-content {
            max-height: 0;
        }

        .quest-scroll {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-gold);
        }

        .quest-scroll:last-child {
            border-bottom: none;
        }

        .quest-name {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            padding-left: 8px;
            border-left: 2px solid var(--accent-gold-dim);
        }

        .checkpoint-parchment {
            background: var(--bg-elevated);
            border: 1px solid var(--border-gold);
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
            position: relative;
        }

        .checkpoint-parchment::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--accent-gold-dim);
            border-radius: 6px 0 0 6px;
            opacity: 0.5;
        }

        .checkpoint-parchment:hover {
            background: var(--bg-panel);
            border-color: var(--accent-gold);
            transform: translateX(4px);
            box-shadow: -4px 0 20px rgba(201, 162, 39, 0.2);
        }

        .checkpoint-parchment.dragging {
            opacity: 0.6;
            cursor: grabbing;
            transform: rotate(2deg) scale(1.02);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .checkpoint-parchment.completed {
            opacity: 0.5;
        }

        .checkpoint-parchment.completed::before {
            background: var(--accent-mist);
        }

        .parchment-text {
            flex: 1;
            font-size: 13px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .checkpoint-parchment.completed .parchment-text {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .parchment-days {
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(201, 162, 39, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .sanctum-stats {
            padding: 20px;
            border-top: 1px solid var(--border-gold);
            background: linear-gradient(180deg, transparent 0%, rgba(201, 162, 39, 0.03) 100%);
        }

        .stats-title {
            font-family: var(--font-display);
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--accent-gold);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .stat-relic {
            text-align: center;
            padding: 14px 8px;
            background: var(--bg-deep);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            position: relative;
        }

        .stat-relic::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 2px;
            background: var(--gradient-gold);
            opacity: 0.5;
        }

        .stat-number {
            font-family: var(--font-display);
            font-size: 26px;
            font-weight: 600;
            color: var(--accent-gold);
            line-height: 1;
            margin-bottom: 6px;
        }

        .stat-label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 右侧时间圣殿 */
        .time-sanctum {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sanctum-nav {
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-gold);
        }

        .chronicle-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .chronicle-arrow {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border-gold);
            background: transparent;
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .chronicle-arrow:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            background: rgba(201, 162, 39, 0.1);
        }

        .chronicle-title {
            font-family: var(--font-display);
            font-size: 24px;
            letter-spacing: 3px;
            min-width: 180px;
            text-align: center;
        }

        .view-glyphs {
            display: flex;
            gap: 4px;
            background: var(--bg-panel);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-gold);
        }

        .glyph-btn {
            padding: 10px 24px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-display);
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .glyph-btn:hover {
            color: var(--accent-gold);
        }

        .glyph-btn.active {
            background: var(--gradient-gold);
            color: var(--bg-deep);
        }

        .chamber-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: auto repeat(6, 1fr);
            gap: 1px;
            background: var(--border-gold);
            border: 1px solid var(--border-gold);
            margin: 0 30px 30px;
            border-radius: 8px;
            overflow: visible;
            position: relative;
        }

        /* 检查项条带 - 跨天条带绝对定位 */
        .checkpoint-stripe {
            position: absolute;
            height: 20px;
            border-radius: 4px;
            font-size: 11px;
            display: flex;
            align-items: center;
            padding: 0 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 5;
            box-sizing: border-box;
            line-height: 1;
        }

        .checkpoint-stripe:hover {
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            filter: brightness(1.15);
        }

        /* 跨天条带 */
        .checkpoint-stripe.continuous {
            border-radius: 0;
        }

        .checkpoint-stripe.continuous-start {
            border-radius: 4px 0 0 4px;
        }

        .checkpoint-stripe.continuous-end {
            border-radius: 0 4px 4px 0;
        }

        .checkpoint-stripe.continuous-start.continuous-end {
            border-radius: 4px;
        }

        /* 条带颜色主题 */
        .checkpoint-stripe.theme-gold {
            background: rgba(201, 162, 39, 0.35);
            border: 1px solid rgba(201, 162, 39, 0.6);
            color: var(--accent-gold);
        }

        .checkpoint-stripe.theme-ember {
            background: rgba(183, 94, 65, 0.35);
            border: 1px solid rgba(183, 94, 65, 0.6);
            color: var(--accent-ember);
        }

        .checkpoint-stripe.theme-mist {
            background: rgba(74, 155, 139, 0.35);
            border: 1px solid rgba(74, 155, 139, 0.6);
            color: var(--accent-mist);
        }

        .checkpoint-stripe.theme-magic {
            background: rgba(123, 104, 238, 0.35);
            border: 1px solid rgba(123, 104, 238, 0.6);
            color: var(--accent-magic);
        }

        .checkpoint-stripe.theme-slate {
            background: rgba(139, 119, 101, 0.35);
            border: 1px solid rgba(139, 119, 101, 0.6);
            color: var(--text-secondary);
        }

        /* 归档状态 */
        .checkpoint-stripe.archived {
            opacity: 0.5;
            text-decoration: line-through;
        }

        /* 条带标签 */
        .stripe-tag {
            font-size: 9px;
            margin-left: 6px;
            padding: 1px 4px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            flex-shrink: 0;
        }

        /* 条带名称 */
        .stripe-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 条带历时显示 */
        .stripe-duration {
            font-size: 10px;
            color: var(--accent-gold);
            flex-shrink: 0;
            opacity: 0.8;
        }

        /* 连续条带样式 - 渐变背景 */
        .checkpoint-stripe.stripe-continuous {
            background: linear-gradient(90deg, rgba(201, 162, 39, 0.25) 0%, rgba(201, 162, 39, 0.15) 100%);
            border-left: 2px solid var(--accent-gold);
        }

        /* 条带关卡名称 - 使用标签样式 */
        .stripe-level {
            font-size: 9px;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.1);
            padding: 1px 6px;
            border-radius: 3px;
            flex-shrink: 0;
            letter-spacing: 0.5px;
        }

        /* 条带分隔符 */
        .stripe-separator {
            margin: 0 4px;
            color: var(--border-gold);
            opacity: 0.5;
            flex-shrink: 0;
        }

        .weekday-pillar {
            background: var(--bg-panel);
            padding: 16px;
            text-align: center;
            font-family: var(--font-display);
            font-size: 12px;
            letter-spacing: 3px;
            color: var(--accent-gold);
            border-bottom: 1px solid var(--border-gold);
            transition: all 0.3s ease;
        }

        /* 周末折叠状态 - 使用 grid-template-columns */
        .chamber-grid {
            transition: all 0.3s ease;
        }

        .chamber-grid.weekend-collapsed {
            grid-template-columns: repeat(5, 1fr) 0 0;
        }

        .chamber-grid.weekend-collapsed .weekday-pillar:nth-child(1),
        .chamber-grid.weekend-collapsed .weekday-pillar:nth-child(7) {
            width: 0;
            padding: 0;
            min-width: 0;
            overflow: hidden;
            opacity: 0;
        }

        .chamber-grid.weekend-collapsed .time-chamber:nth-child(7n+1),
        .chamber-grid.weekend-collapsed .time-chamber:nth-child(7n+7) {
            width: 0;
            padding: 0;
            min-width: 0;
            overflow: hidden;
            opacity: 0;
        }

        /* 周末切换栏 */
        .weekend-toggle-bar {
            display: flex;
            justify-content: flex-end;
            padding: 8px 30px;
            background: var(--bg-panel);
            border-bottom: 1px solid var(--border-gold);
        }

        .weekend-toggle-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border-gold);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .weekend-toggle-btn:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .weekend-toggle-btn.active {
            background: rgba(201, 162, 39, 0.15);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .toggle-icon {
            font-size: 14px;
        }

        .time-chamber {
            background: var(--bg-deep);
            min-height: 140px;
            height: 140px;
            padding: 8px;
            position: relative;
            transition: all 0.3s ease;
            cursor: pointer;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* 自定义滚动条 */
        .time-chamber::-webkit-scrollbar {
            width: 4px;
        }
        .time-chamber::-webkit-scrollbar-track {
            background: transparent;
        }
        .time-chamber::-webkit-scrollbar-thumb {
            background: var(--border-gold);
            border-radius: 2px;
        }

        .time-chamber:hover {
            background: var(--bg-panel);
        }

        .time-chamber.other-month {
            opacity: 0.4;
        }

        .time-chamber.today::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-gold);
        }

        .time-chamber.drag-over {
            background: rgba(201, 162, 39, 0.15);
            box-shadow: inset 0 0 30px rgba(201, 162, 39, 0.2);
        }

        .chamber-date {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 20px;
        }

        .time-chamber.today .chamber-date {
            color: var(--accent-gold);
        }

        .chamber-count {
            font-size: 11px;
            background: rgba(201, 162, 39, 0.2);
            color: var(--accent-gold);
            padding: 2px 8px;
            border-radius: 10px;
        }

        .chamber-scrolls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 80px;
            overflow-y: auto;
        }

        /* 条带颜色编码 - 根据关卡/任务类型（用于格子内条带） */
        .chamber-scrolls .checkpoint-stripe {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 28px;
            position: relative;
        }

        .chamber-scrolls .stripe-name {
            flex: 1;
            font-size: 12px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chamber-scrolls .stripe-tags {
            display: flex;
            gap: 4px;
            margin: 0 8px;
            flex-shrink: 0;
        }

        .chamber-scrolls .stripe-tag {
            font-size: 9px;
            padding: 1px 4px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .chamber-scrolls .stripe-streak {
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 2px;
            color: var(--accent-gold);
            flex-shrink: 0;
        }

        /* 条带颜色编码 - 根据关卡/任务类型 */
        .chamber-scrolls .checkpoint-stripe.stripe-quest-explore {
            background: rgba(74, 155, 139, 0.25);
            border-left: 3px solid var(--accent-mist);
        }

        .chamber-scrolls .checkpoint-stripe.stripe-quest-battle {
            background: rgba(201, 100, 100, 0.25);
            border-left: 3px solid var(--accent-ember);
        }

        .chamber-scrolls .checkpoint-stripe.stripe-quest-study {
            background: rgba(123, 104, 238, 0.25);
            border-left: 3px solid var(--accent-magic);
        }

        .chamber-scrolls .checkpoint-stripe.stripe-quest-health {
            background: rgba(100, 180, 100, 0.25);
            border-left: 3px solid #64b464;
        }

        .chamber-scrolls .checkpoint-stripe.stripe-quest-creative {
            background: rgba(201, 162, 39, 0.25);
            border-left: 3px solid var(--accent-gold);
        }

        .chamber-scrolls .checkpoint-stripe.stripe-default {
            background: var(--bg-elevated);
            border: 1px solid var(--border-gold);
        }

        .chamber-scrolls .checkpoint-stripe:hover {
            filter: brightness(1.1);
        }

        .chamber-scrolls .checkpoint-stripe.before-archive {
            opacity: 0.5;
        }

        .chamber-scrolls .checkpoint-stripe.before-archive .stripe-name {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .chamber-scrolls .checkpoint-stripe.archive-day {
            background: rgba(201, 162, 39, 0.35);
            border-color: var(--accent-gold);
            box-shadow: 0 0 8px rgba(201, 162, 39, 0.3);
        }

        /* 单独条带 */
        .chamber-scrolls .checkpoint-stripe.solo {
            border-radius: 4px;
        }

        /* 连续段开始 */
        .chamber-scrolls .checkpoint-stripe.start {
            border-radius: 4px 0 0 4px;
            border-right: none;
        }

        /* 连续段中间 */
        .chamber-scrolls .checkpoint-stripe.middle {
            border-radius: 0;
            border-left: 1px dashed rgba(255,255,255,0.3);
            border-right: none;
        }

        /* 连续段结束 */
        .chamber-scrolls .checkpoint-stripe.end {
            border-radius: 0 4px 4px 0;
            border-left: 1px dashed rgba(255,255,255,0.3);
        }

        /* 连续条带渐变色 */
        .chamber-scrolls .checkpoint-stripe.continuous {
            background: linear-gradient(90deg, var(--stripe-color) 0%, var(--stripe-color-light) 100%);
        }

        /* 连续段悬停高亮 */
        .chamber-scrolls .checkpoint-stripe.continuous:hover,
        .chamber-scrolls .checkpoint-stripe.continuous.highlight {
            filter: brightness(1.2);
            box-shadow: 0 0 10px rgba(201, 162, 39, 0.5);
            z-index: 100;
        }

        /* 连续天数徽章 */
        .streak-badge {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font-size: 10px;
            color: var(--accent-ember);
            margin-left: 4px;
            font-weight: 600;
        }

        .chamber-more {
            text-align: center;
            padding: 6px;
            font-size: 11px;
            color: var(--accent-gold);
            background: rgba(201, 162, 39, 0.1);
            border-radius: 4px;
            cursor: pointer;
        }

        .empty-archive {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        /* 弹窗 */
        .scroll-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 12, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .scroll-modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .scroll-modal {
            background: var(--bg-panel);
            border: 1px solid var(--border-gold);
            border-radius: 8px;
            width: 90%;
            max-width: 900px;
            height: 85vh;
            max-height: 85vh;
            overflow: hidden;
            transform: scaleY(0) translateY(50px);
            transform-origin: bottom;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .scroll-modal-overlay.active .scroll-modal {
            transform: scaleY(1) translateY(0);
        }

        .modal-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .modal-header-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .checkpoint-breadcrumb {
            font-size: 15px;
            color: var(--text-primary);
            font-family: var(--font-display);
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

    </style>
</head>
<body>
    <div class="bg-texture"></div>

    <header class="temple-header">
        <div class="temple-brand">
            <div class="temple-seal">⚔️</div>
            <div class="temple-title">LIFE RPG</div>
        </div>

            <a href="level-admin.html" class="nav-rune">关卡管理</a>
            <a href="calendar.html" class="nav-rune active">日历视图</a>
        </nav>
    </header>

    <main class="sanctum-layout">
        <!-- 左侧卷轴库 -->
        <aside class="scroll-archive">
            <div class="archive-header">
                <div class="archive-title">待分配卷轴</div>
                <div class="archive-subtitle">拖拽卷轴至时间密室</div>
            </div>

            <div class="scroll-collection" id="scrollCollection">
                <!-- 动态生成 -->
            </div>

            <div class="sanctum-stats">
                <div class="stats-title">📊 本月洞察</div>
                <div class="stats-grid">
                    <div class="stat-relic">
                        <div class="stat-number" id="statCompleted">0</div>
                        <div class="stat-label">已完成</div>
                    </div>
                    <div class="stat-relic">
                        <div class="stat-number" id="statActive">0</div>
                        <div class="stat-label">活跃日</div>
                    </div>
                    <div class="stat-relic">
                        <div class="stat-number" id="statStreak">0</div>
                        <div class="stat-label">连续</div>
                    </div>
                </div>

        <!-- 右侧时间圣殿 -->
        <section class="time-sanctum">

                <div class="chronicle-controls">

                    <h2 class="chronicle-title" id="chronicleTitle">2025年 一月</h2>
                    <button class="chronicle-arrow" onclick="changeMonth(1)">▶</button>
                </div>
                <div class="view-glyphs">

                <button class="weekend-toggle-btn" id="weekendToggleBtn" onclick="toggleWeekend()">
                    <span class="toggle-icon">📅</span>
                    <span class="toggle-text">显示周末</span>
                </button>

            <div class="chamber-grid" id="chamberGrid">
                <!-- 动态生成 -->
            </div>

    <!-- 卷轴编辑弹窗 -->
    <div class="scroll-modal-overlay" id="scrollModal">
        <div class="scroll-modal">
            <div class="modal-header">
                <div class="modal-header-left">
                    <div class="checkpoint-breadcrumb" id="modalCheckpoint">检查点1<span class="breadcrumb-path">史东薇尔城 › 探索外围 › 关卡名</span></div>
                </div>
                <div class="modal-actions">
                    <button class="rune-btn rune-btn-danger" id="deleteBtn" onclick="deleteEntry()">销毁</button>
                    <button class="rune-btn rune-btn-archive" id="archiveBtn" onclick="archiveEntry()" title="归档后该检查项将被标记为完成，历史日期的相同检查项将显示删除线">归档</button>
                    <button class="rune-btn rune-btn-primary" onclick="saveEntry()">铭刻</button>
                </div>
            </div>
            <div class="modal-body">
                <!-- 左侧：编辑面板 -->
                <div class="modal-edit-panel">
                    <div class="duration-bar">
                        <span class="duration-date" id="modalDate">2025年1月15日</span>
                        <span class="duration-divider"></span>
                        <span class="duration-item">总历时: <strong id="totalDurationDisplay">1 天</strong></span>
                        <span class="duration-separator">|</span>
                        <span class="duration-item">实际: <strong id="actualDurationDisplay">1 天</strong></span>
                    </div>

                    <div class="tag-section">
                        <div class="tag-list" id="tagList"></div>
                        <div class="tag-input-wrapper">
                            <input type="text" id="tagInput" class="tag-input" placeholder="+ 标签" autocomplete="off">
                            <div class="tag-suggestions" id="tagSuggestions"></div>
                        </div>

                    </div>

                </div>

                <!-- 右侧：历史记录面板 -->
                <div class="modal-timeline-panel" id="timelinePanel">
                    <div class="history-timeline" id="historyTimeline">
                        <!-- 动态生成 -->
                    </div>

                </div>

    <script>
        // 数据存储
        let adminData = {
            tags: [],
            landmarks: [],
            landmarkQuests: {},
            questLevels: {},
            calendarEntries: {},
            checkpointCompletions: {}
        };

        // 状态
        let currentDate = new Date();
        let currentView = 'month';
        let draggedCheckpoint = null;
        let selectedDate = null;
        let editingEntryId = null;

        /**
         * 初始化
         */
        // 周末折叠状态
        let isWeekendCollapsed = localStorage.getItem('lifeRpgWeekendCollapsed') === 'true';

        /**
         * 切换周末显示/隐藏
         */
        function toggleWeekend() {
            isWeekendCollapsed = !isWeekendCollapsed;
            localStorage.setItem('lifeRpgWeekendCollapsed', isWeekendCollapsed);
            applyWeekendToggle();
        }

        /**
         * 应用周末折叠状态
         */
        function applyWeekendToggle() {
            const grid = document.getElementById('chamberGrid');
            const btn = document.getElementById('weekendToggleBtn');
            const btnText = btn.querySelector('.toggle-text');

            if (isWeekendCollapsed) {
                grid.classList.add('weekend-collapsed');
                btn.classList.remove('active');
                btnText.textContent = '显示周末';
            } else {
                grid.classList.remove('weekend-collapsed');
                btn.classList.add('active');
                btnText.textContent = '隐藏周末';
            }

            // 重新计算条带位置
            setTimeout(() => {
                const rowStripes = {};
                const stripes = grid.querySelectorAll('.checkpoint-stripe');
                stripes.forEach(stripe => {
                    const startCol = parseInt(stripe.dataset.startCol) || 0;
                    const endCol = parseInt(stripe.dataset.endCol) || startCol;
                    const startRow = parseInt(stripe.dataset.startRow) || 0;
                    const duration = parseInt(stripe.dataset.duration) || 1;

                    if (!rowStripes[startRow]) rowStripes[startRow] = [];
                    rowStripes[startRow].push({
                        stripe,
                        startCol,
                        endCol,
                        duration,
                        startRow,
                        endRow: startRow
                    });
                });
                calculateStripePositions(grid, rowStripes);
            }, 310); // 等待 CSS 过渡完成
        }

        function init() {
            try {
                loadData();
                renderScrollArchive();
                renderChamberGrid();
                updateStats();
                bindModalEvents();
                applyWeekendToggle();
            } catch (error) {
                console.error('初始化失败:', error);
            }
        }

        /**
         * 绑定弹窗事件
         */
        function bindModalEvents() {
            const modal = document.getElementById('scrollModal');
            if (modal) {
                LifeRPG.events.add(modal, 'click', function(e) {
                    if (e.target === this) closeModal();
                });
            }
        }

        /**
         * 加载数据
         */
        function loadData() {
            try {
                const savedData = LifeRPG.data.load();
                if (savedData) {
                    adminData = {
                        ...adminData,
                        ...savedData
                    };
                    if (!adminData.calendarEntries) adminData.calendarEntries = {};
                    if (!adminData.checkpointCompletions) adminData.checkpointCompletions = {};
                }
            } catch (error) {
                console.error('加载数据失败:', error);
            }
        }

        /**
         * 保存数据
         */
        function saveData() {
            try {
                LifeRPG.data.save(adminData);
            } catch (error) {
                console.error('保存数据失败:', error);
            }
        }

        /**
         * 获取检查点的完成历史
         */
        function getCheckpointHistory(checkpointId) {
            return adminData.checkpointCompletions[checkpointId] || [];
        }

        /**
         * 计算检查项的连续日期段
         * @param {string} checkpointId - 检查点ID
         * @returns {Array} - 连续日期段数组 [{startDate, endDate, duration}, ...]
         */
        function calculateContinuousRanges(checkpointId) {
            const history = getCheckpointHistory(checkpointId);
            if (history.length === 0) return [];

            // 提取所有日期并排序
            const dates = history.map(h => h.date).sort();

            const ranges = [];
            let currentRange = {
                startDate: dates[0],
                endDate: dates[0]
            };

            for (let i = 1; i < dates.length; i++) {
                const prevDate = new Date(dates[i - 1]);
                const currDate = new Date(dates[i]);

                // 计算日期差（天数）
                const diffTime = currDate - prevDate;
                const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    // 连续日期，扩展当前段
                    currentRange.endDate = dates[i];
                } else {
                    // 不连续，保存当前段并开始新段
                    currentRange.duration = calculateDuration(currentRange.startDate, currentRange.endDate);
                    ranges.push(currentRange);
                    currentRange = {
                        startDate: dates[i],
                        endDate: dates[i]
                    };
                }
            }

            // 保存最后一个段
            currentRange.duration = calculateDuration(currentRange.startDate, currentRange.endDate);
            ranges.push(currentRange);

            return ranges;
        }

        /**
         * 获取指定日期在连续段中的位置类型
         * @param {string} checkpointId - 检查点ID
         * @param {string} dateStr - 日期字符串
         * @returns {Object} - { type: 'solo'|'start'|'middle'|'end'|'none', range: Object|null, streak: number }
         */
        function getStripePosition(checkpointId, dateStr) {
            const ranges = calculateContinuousRanges(checkpointId);

            for (const range of ranges) {
                if (dateStr >= range.startDate && dateStr <= range.endDate) {
                    const dates = [];
                    let current = new Date(range.startDate);
                    const end = new Date(range.endDate);

                    while (current <= end) {
                        dates.push(formatDate(new Date(current)));
                        current.setDate(current.getDate() + 1);
                    }

                    const index = dates.indexOf(dateStr);
                    const total = dates.length;

                    if (total === 1) {
                        return { type: 'solo', range, streak: 1 };
                    } else if (index === 0) {
                        return { type: 'start', range, streak: total };
                    } else if (index === total - 1) {
                        return { type: 'end', range, streak: total };
                    } else {
                        return { type: 'middle', range, streak: total };
                    }
                }
            }

            return { type: 'none', range: null, streak: 0 };
        }

        /**
         * 获取检查点的完成日期（归档日期）
         */
        function getCheckpointArchiveDate(checkpointId) {
            const history = getCheckpointHistory(checkpointId);
            const archived = history.find(h => h.archived);
            return archived ? archived.date : null;
        }

        /**
         * 判断检查项在指定日期的显示状态
         */
        function getEntryStatusForDate(checkpointId, dateStr) {
            const history = getCheckpointHistory(checkpointId);
            const currentRecord = history.find(h => h.date === dateStr);
            const archivedRecord = history.find(h => h.archived);

            if (currentRecord && currentRecord.archived) {
                return 'archive-day';
            }

            if (archivedRecord) {
                const entryTime = new Date(dateStr).getTime();
                const archiveTime = new Date(archivedRecord.date).getTime();

                if (entryTime < archiveTime) return 'before-archive';
                if (entryTime === archiveTime) return 'archive-day';
                return 'no-archive';
            }

            return 'no-archive';
        }

        /**
         * 计算检查项的连续天数（从指定日期往前连续的天数）
         */
        function calculateStreak(checkpointId, dateStr) {
            const history = getCheckpointHistory(checkpointId);
            if (history.length === 0) return 0;

            // 按日期排序
            const sortedDates = history
                .map(h => h.date)
                .sort((a, b) => new Date(b) - new Date(a));

            const targetDate = new Date(dateStr);
            let streak = 0;

            // 检查目标日期是否有记录
            const hasRecordOnTarget = sortedDates.includes(dateStr);
            if (!hasRecordOnTarget) return 0;

            // 从目标日期往前数连续天数
            for (let i = 0; i < 365; i++) {
                const checkDate = new Date(targetDate);
                checkDate.setDate(targetDate.getDate() - i);
                const checkDateStr = formatDate(checkDate);

                if (sortedDates.includes(checkDateStr)) {
                    streak++;
                } else {
                    break;
                }
            }

            return streak;
        }

        /**
         * 高亮显示连续段中的所有条带
         * @param {string} checkpointId - 检查点ID
         * @param {string} startDate - 连续段开始日期
         * @param {string} endDate - 连续段结束日期
         */
        function highlightStreak(checkpointId, startDate, endDate) {
            if (!startDate || !endDate || startDate === endDate) return;

            // 找到同一检查点在同一连续段中的所有条带
            const stripes = document.querySelectorAll(`.checkpoint-stripe[data-cp-id="${checkpointId}"]`);
            stripes.forEach(stripe => {
                const stripeStart = stripe.dataset.streakStart;
                const stripeEnd = stripe.dataset.streakEnd;
                if (stripeStart === startDate && stripeEnd === endDate) {
                    stripe.classList.add('highlight');
                }
            });
        }

        /**
         * 取消高亮所有条带
         */
        function unhighlightStreak() {
            const highlighted = document.querySelectorAll('.checkpoint-stripe.highlight');
            highlighted.forEach(stripe => {
                stripe.classList.remove('highlight');
            });
        }

        /**
         * 根据任务名称获取颜色编码类名
         */
        function getQuestTypeClass(questName) {
            if (!questName) return 'stripe-default';

            const name = questName.toLowerCase();

            // 探索类任务
            if (name.includes('探索') || name.includes('发现') || name.includes('调研') ||
                name.includes('考察') || name.includes('调查') || name.includes('观察')) {
                return 'stripe-quest-explore';
            }

            // 战斗/挑战类任务
            if (name.includes('战斗') || name.includes('挑战') || name.includes('攻克') ||
                name.includes('突破') || name.includes('对抗') || name.includes('竞争')) {
                return 'stripe-quest-battle';
            }

            // 学习/研究类任务
            if (name.includes('学习') || name.includes('研究') || name.includes('阅读') ||
                name.includes('技能') || name.includes('知识') || name.includes('课程')) {
                return 'stripe-quest-study';
            }

            // 健康/运动类任务
            if (name.includes('健康') || name.includes('运动') || name.includes('健身') ||
                name.includes('锻炼') || name.includes('体能') || name.includes('养生')) {
                return 'stripe-quest-health';
            }

            // 创造/艺术类任务
            if (name.includes('创造') || name.includes('创作') || name.includes('艺术') ||
                name.includes('写作') || name.includes('设计') || name.includes('制作')) {
                return 'stripe-quest-creative';
            }

            return 'stripe-default';
        }

        /**

        function renderChamberGrid() {

                const grid = document.getElementById('chamberGrid');

                const startDate = new Date(firstDay);
                startDate.setDate(startDate.getDate() - firstDay.getDay());

                for (let i = 0; i < 42; i++) {

                    date.setDate(startDate.getDate() + i);
