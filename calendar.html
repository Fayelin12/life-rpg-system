        /**
         * 获取日期待办统计
         * @param {string} dateStr - 日期字符串
         * @returns {Object} - { completed: number, total: number }
         */
        function getDateTodoStats(dateStr) {
            const entries = adminData.calendarEntries[dateStr] || [];
            let completed = 0;
            let total = 0;

            entries.forEach(entry => {
                if (entry.description) {
                    const todos = markdownToTodos(entry.description);
                    todos.forEach(todo => {
                        total++;
                        if (todo.completed) completed++;
                    });
                }
            });

            return { completed, total };
        }

        /**
         * 渲染时间密室网格（分层 Grid 布局）
         */
        function renderChamberGrid() {
            try {
                const grid = document.getElementById('chamberGrid');
                if (!grid) return;

                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();

                // 更新标题
                const monthNames = LifeRPG.constants.MONTH_NAMES;
                document.getElementById('chronicleTitle').textContent = `${year}年 ${monthNames[month]}`;

                // 星期标题
                const weekdays = LifeRPG.constants.WEEKDAYS;
                let html = '<div class="weekday-header">';
                html += weekdays.map(d => `<div class="weekday-pillar">${d}</div>`).join('');
                html += '</div>';

                // 日期区域
                html += '<div class="calendar-body">';

                const today = new Date();

                // 获取当月第一天和最后一天
                const firstDayOfMonth = new Date(year, month, 1);
                const lastDayOfMonth = new Date(year, month + 1, 0);

                // 计算当月第一天是周几（周一为0，周日为6）
                const firstDayWeekday = (firstDayOfMonth.getDay() + 6) % 7;

                // 计算需要的行数
                const daysInMonth = lastDayOfMonth.getDate();
                const totalCells = firstDayWeekday + daysInMonth;
                const rowsNeeded = Math.ceil(totalCells / 7);

                // 按行生成日历
                for (let row = 0; row < rowsNeeded; row++) {
                    html += `<div class="calendar-row" data-row="${row}">`;

                    // 先收集每列是否为空
                    const emptyCols = [];
                    for (let col = 0; col < 7; col++) {
                        const cellIndex = row * 7 + col;
                        const dayOffset = cellIndex - firstDayWeekday;
                        const date = new Date(year, month, dayOffset + 1);
                        if (date.getMonth() !== month) {
                            emptyCols.push(col);
                        }
                    }

                    for (let col = 0; col < 7; col++) {
                        const cellIndex = row * 7 + col;
                        const dayOffset = cellIndex - firstDayWeekday;
                        const date = new Date(year, month, dayOffset + 1);

                        // 只显示当月日期
                        if (date.getMonth() !== month) {
                            // 非当月日期显示为空格子
                            html += `<div class="time-chamber empty" data-index="${cellIndex}" data-col="${col}"></div>`;
                            continue;
                        }

                        const isToday = date.toDateString() === today.toDateString();
                        const dateStr = formatDate(date);

                        // 计算当日待办统计
                        const todoStats = getDateTodoStats(dateStr);
                        const statsHtml = todoStats.total > 0
                            ? `<span class="chamber-stats" title="已完成/总待办">${todoStats.completed === todoStats.total ? '🎉 ' : ''}${todoStats.completed}/${todoStats.total}</span>`
                            : '';

                        html += `
                            <div class="time-chamber ${isToday ? 'today' : ''}"
                                data-date="${dateStr}" data-index="${cellIndex}" data-col="${col}">
                                <div class="chamber-date">
                                    <span>${date.getDate()}</span>
                                    ${statsHtml}
                                </div>
                            </div>
                        `;
                    }

                    // 条带容器 - 放在行内，标记空列
                    const emptyColsAttr = emptyCols.length > 0 ? `data-empty-cols="${emptyCols.join(',')}"` : '';
                    html += `<div class="row-stripes" data-row="${row}" ${emptyColsAttr}></div>`;
                    html += `</div>`; // 结束 calendar-row
                }

                html += '</div>'; // 结束 calendar-body

                grid.setAttribute('data-rows', rowsNeeded.toString());
                grid.innerHTML = html;

                // 渲染检查点条带
                renderCheckpointStripes(grid, year, month, firstDayWeekday, daysInMonth);

                bindChamberDragEvents();
            } catch (error) {
                console.error('渲染时间密室网格失败:', error);
            }
        }

        /**
         * 计算检查点的连续日期范围
         */
        function calculateStripeRanges(checkpointId) {
            const history = getCheckpointHistory(checkpointId);
            if (history.length === 0) return [];

            // 提取所有日期并排序
            const dates = history.map(h => h.date).sort();

            const ranges = [];
            let currentRange = {
                startDate: dates[0],
                endDate: dates[0],
                entries: [history.find(h => h.date === dates[0])]
            };

            for (let i = 1; i < dates.length; i++) {
                const prevDate = parseLocalDate(dates[i - 1]);
                const currDate = parseLocalDate(dates[i]);
                const diffDays = Math.round((currDate - prevDate) / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    // 连续日期，扩展当前范围
                    currentRange.endDate = dates[i];
                    currentRange.entries.push(history.find(h => h.date === dates[i]));
                } else {
                    // 不连续，保存当前范围并开始新范围
                    ranges.push({...currentRange});
                    currentRange = {
                        startDate: dates[i],
                        endDate: dates[i],
                        entries: [history.find(h => h.date === dates[i])]
                    };
                }
            }

            // 保存最后一个范围
            ranges.push(currentRange);

            // 计算每个范围的持续时间
            ranges.forEach(range => {
                range.duration = calculateDuration(range.startDate, range.endDate);
            });

            return ranges;
        }

        /**
         * 根据历时天数获取条带颜色类
         * 天数越长颜色越深（使用当月历时天数，最大31天均匀分布）
         */
        function getStripeColorByDuration(totalDuration) {
            if (totalDuration <= 1) return 'theme-gold-light';      // 1天
            if (totalDuration <= 6) return 'theme-gold';            // 2-6天
            if (totalDuration <= 12) return 'theme-gold-deep';      // 7-12天
            if (totalDuration <= 18) return 'theme-ember';          // 13-18天
            if (totalDuration <= 24) return 'theme-ember-deep';     // 19-24天
            return 'theme-slate';                                    // 25-31天
        }

        /**
         * 渲染检查点条带（分层 Grid 布局）
         */
        function renderCheckpointStripes(grid, year, month, firstDayWeekday, daysInMonth) {
            const checkpointThemes = {};

            // 构建日期索引映射 - 只包含当月日期
            const dateIndexMap = {};
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const dateStr = formatDate(date);
                const index = firstDayWeekday + (day - 1);
                dateIndexMap[dateStr] = {
                    index: index,
                    row: Math.floor(index / 7),
                    col: index % 7
                };
            }

            // 收集每个检查点的所有条目
            const checkpointData = {};
            Object.keys(adminData.calendarEntries || {}).forEach(dateStr => {
                const entries = adminData.calendarEntries[dateStr];
                entries.forEach(entry => {
                    if (!checkpointData[entry.checkpointId]) {
                        checkpointData[entry.checkpointId] = {
                            name: entry.checkpointName,
                            entries: [],
                            levelId: entry.levelId,
                            questId: entry.questId,
                            landmarkName: entry.landmarkName,
                            questName: entry.questName,
                            levelName: entry.levelName
                        };
                        // 主题色将在后面根据总历时天数分配
                    }
                    checkpointData[entry.checkpointId].entries.push({
                        ...entry,
                        date: dateStr
                    });
                });
            });

            // 按行收集条带，用于计算层级
            const rowStripes = {}; // { rowIndex: [{startCol, endCol}, ...] }

            // 为每个检查点计算连续范围并渲染条带
            Object.keys(checkpointData).forEach(checkpointId => {
                const cpData = checkpointData[checkpointId];
                const ranges = calculateStripeRanges(checkpointId);

                ranges.forEach(range => {
                    // 检查该范围是否与当前月份有交集
                    const rangeStart = parseLocalDate(range.startDate);
                    const rangeEnd = parseLocalDate(range.endDate);
                    const monthStart = new Date(year, month, 1);
                    const monthEnd = new Date(year, month + 1, 0);
                    
                    // 如果范围完全在当前月份之外，跳过
                    if (rangeEnd < monthStart || rangeStart > monthEnd) return;
                    
                    // 计算在当前月份内的实际开始和结束日期
                    const actualStartDate = rangeStart < monthStart ? formatDate(monthStart) : range.startDate;
                    const actualEndDate = rangeEnd > monthEnd ? formatDate(monthEnd) : range.endDate;
                    
                    const startInfo = dateIndexMap[actualStartDate];
                    const endInfo = dateIndexMap[actualEndDate];

                    // 只渲染在当前视图范围内的条带
                    if (!startInfo || !endInfo) return;

                    const startRow = startInfo.row;
                    const startCol = startInfo.col;
                    const endCol = endInfo.col;
                    const duration = endCol - startCol + 1;

                    const firstEntry = cpData.entries.find(e => e.date === range.startDate);
                    if (!firstEntry) return;

                    const archiveDate = getCheckpointArchiveDate(checkpointId);
                    const isArchived = !!archiveDate;

                    // 计算总历时（用于显示）
                    const history = getCheckpointHistory(checkpointId);
                    const sortedHistory = [...history].sort((a, b) => new Date(a.date) - new Date(b.date));
                    const firstDate = sortedHistory.length > 0 ? sortedHistory[0].date : range.startDate;
                    const lastDate = sortedHistory.length > 0 ? sortedHistory[sortedHistory.length - 1].date : range.startDate;
                    const totalDuration = calculateDuration(firstDate, lastDate);

                    // 判断是否连续条带（跨越多天）
                    const isContinuous = range.startDate !== range.endDate;

                    // 确定条带样式类（根据当月历时天数设置颜色）
                    let stripeClass = getStripeColorByDuration(duration);
                    if (isContinuous) {
                        stripeClass += ' continuous';
                    }
                    if (isArchived) {
                        stripeClass += ' archived';
                    }

                    // 构建条带内容
                    let stripeContent;
                    if (isContinuous) {
                        stripeContent = `<span class="stripe-level">${LifeRPG.security.escapeHtml(cpData.levelName)}</span><span class="stripe-separator">›</span><span class="stripe-name">${LifeRPG.security.escapeHtml(cpData.name)}</span><span class="stripe-duration">${totalDuration}天</span>`;
                    } else {
                        stripeContent = `<span class="stripe-name">${LifeRPG.security.escapeHtml(cpData.name)}</span><span class="stripe-duration">${totalDuration}天</span>`;
                    }

                    // 计算层级（避免重叠）
                    if (!rowStripes[startRow]) rowStripes[startRow] = [];
                    const occupied = rowStripes[startRow];
                    let level = 1;
                    let found = false;
                    while (!found) {
                        const conflict = occupied.some(o =>
                            o.level === level &&
                            !(endCol < o.startCol || startCol > o.endCol)
                        );
                        if (!conflict) {
                            found = true;
                        } else {
                            level++;
                        }
                    }
                    occupied.push({ level, startCol, endCol });

                    // 创建条带元素
                    const stripe = document.createElement('div');
                    stripe.className = `checkpoint-stripe ${stripeClass}`;
                    stripe.innerHTML = stripeContent;
                    stripe.draggable = true;
                    stripe.style.setProperty('--start', startCol + 1); // CSS grid 是 1-based
                    stripe.style.setProperty('--end', endCol + 2);     // end 是 exclusive
                    stripe.style.setProperty('--level', level);
                    stripe.dataset.checkpointId = checkpointId;
                    stripe.dataset.startDate = range.startDate;
                    stripe.dataset.endDate = range.endDate;
                    stripe.dataset.entryId = firstEntry.id;
                    stripe.dataset.levelId = cpData.levelId;
                    stripe.dataset.questId = cpData.questId;
                    stripe.dataset.landmark = LifeRPG.security.escapeHtml(cpData.landmarkName);
                    stripe.dataset.quest = LifeRPG.security.escapeHtml(cpData.questName);
                    stripe.dataset.level = LifeRPG.security.escapeHtml(cpData.levelName);
                    stripe.dataset.cpName = LifeRPG.security.escapeHtml(cpData.name);
                    stripe.dataset.sourceDate = range.startDate;

                    // 悬停显示自定义 tooltip
                    stripe.addEventListener('mousemove', showStripeTooltip);
                    stripe.addEventListener('mouseleave', hideStripeTooltip);

                    // 点击打开弹窗 - 根据点击位置计算对应日期
                    stripe.onclick = function(e) {
                        e.stopPropagation();
                        
                        // 获取条带的日期范围
                        const startDateStr = this.dataset.startDate;
                        const endDateStr = this.dataset.endDate;
                        const startDate = parseLocalDate(startDateStr);
                        const endDate = parseLocalDate(endDateStr);
                        
                        // 计算条带跨越的天数
                        const dayCount = Math.round((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;
                        
                        // 计算点击的列（相对于条带）
                        const rect = this.getBoundingClientRect();
                        const clickX = e.clientX - rect.left;
                        const colWidth = rect.width / dayCount;
                        const clickedDayOffset = Math.floor(clickX / colWidth);
                        
                        // 计算点击的日期
                        const clickedDate = new Date(startDate.getTime());
                        clickedDate.setDate(startDate.getDate() + clickedDayOffset);
                        const clickedDateStr = formatDate(clickedDate);
                        
                        // 查找该日期的条目
                        const entries = adminData.calendarEntries[clickedDateStr] || [];
                        const entry = entries.find(e => e.checkpointId === checkpointId);
                        
                        if (entry) {
                            openEntryModal(clickedDateStr, entry.id);
                        } else {
                            // 如果该日期没有条目（理论上不应该发生），打开开始日期的弹窗
                            openEntryModal(startDateStr, firstEntry.id);
                        }
                    };

                    // 拖拽事件
                    stripe.ondragstart = function(e) {
                        e.stopPropagation();
                        draggedCheckpoint = {
                            id: checkpointId,
                            entryId: firstEntry.id,
                            levelId: cpData.levelId,
                            questId: cpData.questId,
                            name: cpData.name,
                            landmark: cpData.landmarkName,
                            quest: cpData.questName,
                            level: cpData.levelName,
                            sourceDate: range.startDate,
                            isMoving: true
                        };
                        this.classList.add('dragging');
                        document.body.classList.add('dragging');
                        e.dataTransfer.effectAllowed = 'move';
                    };

                    stripe.ondragend = function() {
                        this.classList.remove('dragging');
                        document.body.classList.remove('dragging');
                    };

                    // 添加到对应行的条带容器
                    const rowStripesContainer = grid.querySelector(`.row-stripes[data-row="${startRow}"]`);
                    if (rowStripesContainer) {
                        rowStripesContainer.appendChild(stripe);
                    }
                });
            });

        }



        /**
         * 绑定密室拖拽事件
         */
        function bindChamberDragEvents() {
            try {
                const chambers = document.querySelectorAll('.time-chamber');
                chambers.forEach(chamber => {
                    LifeRPG.events.add(chamber, 'dragover', function(e) {
                        e.preventDefault();
                        this.classList.add('drag-over');
                    });

                    LifeRPG.events.add(chamber, 'dragleave', function() {
                        this.classList.remove('drag-over');
                    });

                    LifeRPG.events.add(chamber, 'drop', function(e) {
                        e.preventDefault();
                        this.classList.remove('drag-over');

                        if (!draggedCheckpoint) return;

                        const dateStr = this.dataset.date;

                        if (draggedCheckpoint.isMoving && draggedCheckpoint.sourceDate === dateStr) {
                            draggedCheckpoint = null;
                            return;
                        }

                        // 检查该日期是否已有相同检查项
                        const existingEntries = adminData.calendarEntries[dateStr] || [];
                        const hasDuplicate = existingEntries.some(entry =>
                            entry.checkpointId === draggedCheckpoint.id
                        );

                        if (hasDuplicate) {
                            showToast(`该日期已存在「${draggedCheckpoint.name}」检查项`, 'warning');
                            draggedCheckpoint = null;
                            return;
                        }

                        const entry = {
                            id: Date.now().toString(),
                            checkpointId: draggedCheckpoint.id,
                            levelId: draggedCheckpoint.levelId,
                            questId: draggedCheckpoint.questId,
                            checkpointName: draggedCheckpoint.name,
                            landmarkName: draggedCheckpoint.landmark,
                            questName: draggedCheckpoint.quest,
                            levelName: draggedCheckpoint.level,
                            date: dateStr,
                            description: '',
                            completed: false
                        };

                        if (!adminData.calendarEntries[dateStr]) {
                            adminData.calendarEntries[dateStr] = [];
                        }
                        adminData.calendarEntries[dateStr].push(entry);

                        if (!adminData.checkpointCompletions[draggedCheckpoint.id]) {
                            adminData.checkpointCompletions[draggedCheckpoint.id] = [];
                        }
                        adminData.checkpointCompletions[draggedCheckpoint.id].push({
                            date: dateStr,
                            entryId: entry.id,
                            archived: false
                        });

                        saveData();
                        renderScrollArchive();
                        renderChamberGrid();
                        updateStats();
                        // 不自动打开弹窗，用户需要编辑时可点击条带打开
                    });
                });
            } catch (error) {
                console.error('绑定密室拖拽事件失败:', error);
            }
        }

        /**
         * 移动历史未完成的待办到今天
         */
        async function moveUnfinishedTodosToToday(checkpointId, todayStr) {
            const history = getCheckpointHistory(checkpointId);
            if (history.length === 0) return;

            let hasMoved = false;
            const todayEntry = adminData.calendarEntries[todayStr]?.find(e => e.checkpointId === checkpointId);
            if (!todayEntry) return;

            // 获取今天的待办列表
            let todayTodos = todayEntry.description ? markdownToTodos(todayEntry.description) : [];

            // 遍历历史记录，查找未完成的待办
            for (const record of history) {
                if (record.date === todayStr) continue; // 跳过今天

                const entries = adminData.calendarEntries[record.date] || [];
                const entry = entries.find(e => e.checkpointId === checkpointId);
                if (!entry || !entry.description) continue;

                const todos = markdownToTodos(entry.description);
                const unfinishedTodos = todos.filter(t => !t.completed);

                if (unfinishedTodos.length > 0) {
                    // 将未完成的待办移动到今天
                    todayTodos = [...todayTodos, ...unfinishedTodos];

                    // 从历史记录中移除已移动的待办（标记为完成）
                    const finishedTodos = todos.filter(t => t.completed);
                    entry.description = todosToMarkdown(finishedTodos);

                    hasMoved = true;
                }
            }

            if (hasMoved) {
                // 更新今天的待办
                todayEntry.description = todosToMarkdown(todayTodos);
                saveData();

                // 显示提示
                showToast('已将历史未完成的待办移动到今日', 'success');
            }
        }

        /**
         * 打开编辑弹窗
         */
        async function openEntryModal(dateStr, entryId) {
            try {
                event.stopPropagation();
                selectedDate = dateStr;
                editingEntryId = entryId;

                // 检查是否是今天，如果是则移动历史未完成的待办
                const todayStr = formatDate(new Date());
                if (dateStr === todayStr) {
                    showLoading('正在检查历史待办...');
                    await moveUnfinishedTodosToToday(entryId, dateStr);
                    hideLoading();
                }

                const entry = adminData.calendarEntries[dateStr].find(e => e.id === entryId);
                if (!entry) return;

                const date = new Date(dateStr);
                document.getElementById('modalDate').textContent =
                    `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;

                document.getElementById('modalCheckpoint').innerHTML = `
                    ${LifeRPG.security.escapeHtml(entry.checkpointName)}
                    <span class="breadcrumb-path">${LifeRPG.security.escapeHtml(entry.landmarkName)} › ${LifeRPG.security.escapeHtml(entry.questName)} › ${LifeRPG.security.escapeHtml(entry.levelName)}</span>
                `;

                // 加载待办列表（优先使用 entry.todos，兼容旧数据 entry.description）
                loadTodos(entry.todos || entry.description || '');

                const history = getCheckpointHistory(entry.checkpointId);
                const sortedHistory = [...history].sort((a, b) => new Date(a.date) - new Date(b.date));
                const firstDate = sortedHistory.length > 0 ? sortedHistory[0].date : selectedDate;
                const lastDate = sortedHistory.length > 0 ? sortedHistory[sortedHistory.length - 1].date : selectedDate;
                const totalDuration = calculateDuration(firstDate, lastDate);
                document.getElementById('totalDurationDisplay').textContent = totalDuration + ' 天';

                const actualDuration = history.length;
                document.getElementById('actualDurationDisplay').textContent = actualDuration + ' 天';

                renderHistoryTimeline(entry.checkpointId, selectedDate);

                const archiveBtn = document.getElementById('archiveBtn');
                const archiveDate = getCheckpointArchiveDate(entry.checkpointId);
                const isArchivedOnThisDay = archiveDate === dateStr;

                if (isArchivedOnThisDay) {
                    archiveBtn.textContent = '✓ 已归档';
                    archiveBtn.classList.add('archived');
                    archiveBtn.title = '该检查项已在此日期归档';
                } else if (archiveDate) {
                    archiveBtn.textContent = '已归档于 ' + archiveDate;
                    archiveBtn.classList.add('archived');
                    archiveBtn.disabled = true;
                    archiveBtn.title = `该检查项已于 ${archiveDate} 归档`;
                } else {
                    archiveBtn.textContent = '归档';
                    archiveBtn.classList.remove('archived');
                    archiveBtn.disabled = false;
                    archiveBtn.title = '归档后该检查项将被标记为完成，历史日期的相同检查项将显示删除线';
                }

                document.getElementById('deleteBtn').style.display = 'block';

                // 加载标签
                loadCheckpointTags(entry.checkpointId, entry.tags || entry.tag);

                // 更新复制按钮文字（周五显示"复制到下周一"）
                const copyBtn = document.getElementById('copyNextBtn');
                const currentDay = date.getDay();
                copyBtn.textContent = currentDay === 5 ? '复制到下周一' : '复制到下一天';

                // 禁止背景滚动
                document.body.style.overflow = 'hidden';
                document.getElementById('scrollModal').classList.add('active');
            } catch (error) {
                console.error('打开编辑弹窗失败:', error);
            }
        }

        /**
         * 计算两个日期之间的天数
         */
        function calculateDuration(startDateStr, endDateStr) {
            const start = parseLocalDate(startDateStr);
            const end = parseLocalDate(endDateStr);
            const diffTime = Math.abs(end - start);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
            return diffDays;
        }

        /**
         * 渲染历史时间轴
         */
        function renderHistoryTimeline(checkpointId, currentDateStr) {
            try {
                const history = getCheckpointHistory(checkpointId);
                const timeline = document.getElementById('historyTimeline');
                const emptyState = document.getElementById('timelineEmpty');

                if (!timeline) return;

                if (history.length === 0) {
                    timeline.innerHTML = '';
                    if (emptyState) emptyState.style.display = 'block';
                    return;
                }

                if (emptyState) emptyState.style.display = 'none';

                const sortedHistory = [...history].sort((a, b) =>
                    new Date(a.date) - new Date(b.date)
                );

                let html = '';
                sortedHistory.forEach(h => {
                    const entry = findEntryById(h.date, h.entryId);
                    if (!entry) return;

                    const isCompleted = entry.completed || h.completed;
                    console.log('时间轴渲染:', h.date, 'entry.completed:', entry.completed, 'h.completed:', h.completed, 'isCompleted:', isCompleted);
                    const dateLabel = '';

                    // 获取标签数组（兼容新旧数据）
                    let tags = [];
                    if (entry.tags && Array.isArray(entry.tags)) {
                        tags = entry.tags;
                    } else if (entry.tag) {
                        tags = [entry.tag];
                    }
                    const tagsHtml = tags.map(tag =>
                        `<span class="timeline-tag">${LifeRPG.security.escapeHtml(tag)}</span>`
                    ).join('');

                    // 解析待办列表并格式化显示
                    let todosHtml = '';
                    if (entry.description) {
                        const todos = markdownToTodos(entry.description);
                        if (todos.length > 0) {
                            todosHtml = '<div class="timeline-todos">' + 
                                todos.map(todo => `
                                    <div class="timeline-todo ${todo.completed ? 'completed' : ''}">
                                        ${todo.completed ? '☑' : '☐'} ${LifeRPG.security.escapeHtml(todo.text)}
                                    </div>
                                `).join('') + 
                                '</div>';
                        } else {
                            todosHtml = `<span class="timeline-empty">${LifeRPG.security.escapeHtml(entry.description)}</span>`;
                        }
                    } else {
                        todosHtml = '<span class="timeline-empty">暂无记录</span>';
                    }

                    html += `
                        <div class="timeline-item ${isCompleted ? 'completed' : 'pending'}">
                            <div class="timeline-date">${h.date}${dateLabel}</div>
                            <div class="timeline-desc">
                                ${tagsHtml}
                                ${todosHtml}
                            </div>
                        </div>
                    `;
                });

                timeline.innerHTML = html || '<div class="timeline-empty">暂无历史记录</div>';
            } catch (error) {
                console.error('渲染历史时间轴失败:', error);
            }
        }

        /**
         * 根据日期和条目ID查找条目
         */
        function findEntryById(dateStr, entryId) {
            const entries = adminData.calendarEntries[dateStr] || [];
            return entries.find(e => e.id === entryId);
        }

        /**
         * 复制到下一天（周五则复制到下周一）
         */
        // 复制功能的临时数据存储
        let copyTempData = null;

        function copyToNextDay() {
            try {
                if (!selectedDate || !editingEntryId) return;

                // 先获取当前条目和日期（在保存之前，因为saveEntry会关闭弹窗清理状态）
                const entry = adminData.calendarEntries[selectedDate]?.find(e => e.id === editingEntryId);
                if (!entry) return;
                const currentDateStr = selectedDate;

                // 计算下一天日期（使用本地时间避免时区问题）
                const currentDate = parseLocalDate(currentDateStr);
                let nextDate = new Date(currentDate);
                nextDate.setDate(currentDate.getDate() + 1);

                // 如果是周五(5)，则跳到下周一(增加3天)
                if (currentDate.getDay() === 5) {
                    nextDate.setDate(currentDate.getDate() + 3);
                }

                const nextDateStr = formatDate(nextDate);

                // 检查下一天是否已有相同检查点的记录
                const nextDayEntries = adminData.calendarEntries[nextDateStr] || [];
                const existingEntry = nextDayEntries.find(e => e.checkpointId === entry.checkpointId);

                // 调试日志：帮助排查数据问题
                console.log('复制检查:', {
                    nextDateStr,
                    nextDayEntries,
                    checkpointId: entry.checkpointId,
                    existingEntry
                });

                if (existingEntry) {
                    // 存储临时数据
                    copyTempData = { entry, nextDateStr, existingEntry, isNew: false };
                    showConfirmModal({
                        title: '覆盖确认',
                        message: `${nextDateStr} 已有该检查点的记录，是否覆盖？`,
                        icon: '⚠️',
                        confirmText: '覆盖',
                        confirmClass: 'rune-btn-danger',
                        onConfirm: executeCopy
                    });
                } else {
                    // 存储临时数据
                    copyTempData = { entry, nextDateStr, existingEntry: null, isNew: true };
                    executeCopy();
                }

            } catch (error) {
                console.error('复制到下一天失败:', error);
                showConfirmModal({
                    title: '复制失败',
                    message: '复制失败: ' + error.message,
                    icon: '❌',
                    confirmText: '确定',
                    onConfirm: () => {}
                });
            }
        }

        /**
         * 执行复制操作
         */
        function executeCopy() {
            if (!copyTempData) return;

            const { entry, nextDateStr, existingEntry, isNew } = copyTempData;

            if (existingEntry) {
                // 覆盖现有记录（不复制描述，只复制标签）
                existingEntry.tags = entry.tags || (entry.tag ? [entry.tag] : []);

                // 确保 checkpointCompletions 中也有对应的记录（处理旧数据不一致的情况）
                if (!adminData.checkpointCompletions[entry.checkpointId]) {
                    adminData.checkpointCompletions[entry.checkpointId] = [];
                }
                const historyRecord = adminData.checkpointCompletions[entry.checkpointId]
                    .find(h => h.date === nextDateStr && h.entryId === existingEntry.id);
                if (!historyRecord) {
                    adminData.checkpointCompletions[entry.checkpointId].push({
                        date: nextDateStr,
                        entryId: existingEntry.id,
                        completed: existingEntry.completed || false
                    });
                }
            } else {
                // 创建新记录（不复制描述，只复制标签）
                const newEntry = {
                    id: 'entry_' + Date.now(),
                    checkpointId: entry.checkpointId,
                    checkpointName: entry.checkpointName,
                    landmarkId: entry.landmarkId,
                    landmarkName: entry.landmarkName,
                    questId: entry.questId,
                    questName: entry.questName,
                    levelId: entry.levelId,
                    levelName: entry.levelName,
                    description: '',
                    tags: entry.tags || (entry.tag ? [entry.tag] : []),
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                if (!adminData.calendarEntries[nextDateStr]) {
                    adminData.calendarEntries[nextDateStr] = [];
                }
                adminData.calendarEntries[nextDateStr].push(newEntry);

                // 同步创建 checkpointCompletions 记录，使条带能正确渲染
                if (!adminData.checkpointCompletions[entry.checkpointId]) {
                    adminData.checkpointCompletions[entry.checkpointId] = [];
                }
                adminData.checkpointCompletions[entry.checkpointId].push({
                    date: nextDateStr,
                    entryId: newEntry.id,
                    completed: false
                });
            }

            saveData();

            // 刷新日历视图
            renderChamberGrid();

            // 显示成功提示
            const btn = document.getElementById('copyNextBtn');
            const originalText = btn.textContent;
            btn.textContent = '✓ 已复制';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 1500);

            // 关闭弹窗
            closeModal();

            copyTempData = null;
        }

        /**
         * 获取检查项的所有标签（从历史记录中收集）
         */
        function getCheckpointTags(checkpointId) {
            const tags = new Set();
            const history = getCheckpointHistory(checkpointId);

            history.forEach(h => {
                const entry = findEntryById(h.date, h.entryId);
                if (entry && entry.tags && Array.isArray(entry.tags)) {
                    entry.tags.forEach(tag => tags.add(tag));
                } else if (entry && entry.tag) {
                    // 兼容旧数据（单标签）
                    tags.add(entry.tag);
                }
            });

            return Array.from(tags).sort();
        }

        // 当前编辑的标签数组
        let currentTags = [];

        /**
         * 渲染标签列表
         */
        function renderTagList() {
            const tagList = document.getElementById('tagList');
            tagList.innerHTML = currentTags.map((tag, index) => `
                <span class="tag-item">
                    ${LifeRPG.security.escapeHtml(tag)}
                    <span class="tag-remove" onclick="removeTag(${index})" title="移除">×</span>
                </span>
            `).join('');
        }

        /**
         * 添加标签
         */
        function addTag(tagName) {
            tagName = tagName.trim();
            if (!tagName) return;
            if (currentTags.includes(tagName)) return;

            currentTags.push(tagName);
            renderTagList();
        }

        /**
         * 移除标签
         */
        function removeTag(index) {
            currentTags.splice(index, 1);
            renderTagList();
        }

        // 当前检查点的可用标签
        let availableTags = [];

        /**
         * 加载检查项标签
         */
        function loadCheckpointTags(checkpointId, entryTags) {
            const tagInput = document.getElementById('tagInput');
            const tagSuggestions = document.getElementById('tagSuggestions');

            // 初始化当前标签数组
            if (entryTags && Array.isArray(entryTags)) {
                currentTags = [...entryTags];
            } else if (entryTags) {
                // 兼容旧数据（单标签字符串）
                currentTags = [entryTags];
            } else {
                currentTags = [];
            }
            renderTagList();

            // 清空输入框
            tagInput.value = '';

            // 加载已有标签选项
            availableTags = getCheckpointTags(checkpointId);

            // 显示标签建议列表的函数
            function showTagSuggestions(filterValue = '') {
                const value = filterValue.trim().toLowerCase();
                
                // 过滤标签（排除已添加的）
                let matches = availableTags.filter(tag =>
                    !currentTags.includes(tag)
                );
                
                // 如果有输入值，则进一步过滤
                if (value) {
                    matches = matches.filter(tag =>
                        tag.toLowerCase().includes(value)
                    );
                }

                if (matches.length > 0) {
                    tagSuggestions.innerHTML = matches.map(tag =>
                        `<div class="tag-suggestion-item" data-tag="${LifeRPG.security.escapeHtml(tag)}">${LifeRPG.security.escapeHtml(tag)}</div>`
                    ).join('');
                    tagSuggestions.classList.add('active');

                    // 绑定点击事件
                    tagSuggestions.querySelectorAll('.tag-suggestion-item').forEach(item => {
                        item.onclick = function() {
                            addTag(this.dataset.tag);
                            tagInput.value = '';
                            tagSuggestions.classList.remove('active');
                        };
                    });
                } else {
                    tagSuggestions.classList.remove('active');
                }
            }

            // 绑定输入事件（显示建议）
            tagInput.oninput = function() {
                showTagSuggestions(this.value);
            };

            // 绑定聚焦事件（点击输入框时显示所有可用标签）
            tagInput.onfocus = function() {
                showTagSuggestions(this.value);
            };

            // 绑定回车事件
            tagInput.onkeydown = function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const activeItem = tagSuggestions.querySelector('.tag-suggestion-item.active');
                    if (activeItem) {
                        addTag(activeItem.dataset.tag);
                    } else if (this.value.trim()) {
                        addTag(this.value);
                    }
                    this.value = '';
                    tagSuggestions.classList.remove('active');
                } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    const items = tagSuggestions.querySelectorAll('.tag-suggestion-item');
                    if (items.length === 0) return;

                    let activeIndex = Array.from(items).findIndex(item => item.classList.contains('active'));
                    if (e.key === 'ArrowDown') {
                        activeIndex = activeIndex < items.length - 1 ? activeIndex + 1 : 0;
                    } else {
                        activeIndex = activeIndex > 0 ? activeIndex - 1 : items.length - 1;
                    }

                    items.forEach(item => item.classList.remove('active'));
                    items[activeIndex].classList.add('active');
                }
            };

            // 点击外部关闭建议
            const clickOutsideHandler = function(e) {
                if (!e.target.closest('.tag-input-wrapper')) {
                    tagSuggestions.classList.remove('active');
                }
            };
            document.addEventListener('click', clickOutsideHandler);

            // 存储处理器引用以便后续清理
            window._tagClickHandler = clickOutsideHandler;
        }

        // ==================== 待办列表功能 ====================

        // 当前待办列表
        let currentTodos = [];

        /**
         * 将待办列表转换为 Markdown 格式
         * @param {Array} todos - [{text: string, completed: boolean}]
         * @returns {string} - Markdown 格式字符串
         */
        function todosToMarkdown(todos) {
            if (!todos || todos.length === 0) return '';
            return todos.map(todo => {
                const checkbox = todo.completed ? '[x]' : '[ ]';
                return `${checkbox} ${todo.text}`;
            }).join('\n');
        }

        /**
         * 从 Markdown 解析待办列表
         * @param {string} markdown - Markdown 格式字符串
         * @returns {Array} - [{text: string, completed: boolean}]
         */
        function markdownToTodos(markdown) {
            if (!markdown || !markdown.trim()) return [];
            const lines = markdown.trim().split('\n');
            return lines.map(line => {
                const completed = line.trim().startsWith('[x]') || line.trim().startsWith('[X]');
                const text = line.replace(/^\[[ xX]\]\s*/, '').trim();
                return { text, completed };
            }).filter(todo => todo.text);
        }

        /**
         * 渲染待办列表
         */
        function renderTodoList() {
            const todoList = document.getElementById('todoList');
            if (!todoList) return;

            todoList.innerHTML = currentTodos.map((todo, index) => `
                <div class="todo-item" data-index="${index}">
                    <div class="todo-checkbox ${todo.completed ? 'checked' : ''}" onclick="toggleTodoItem(${index})">
                        ${todo.completed ? '✓' : ''}
                    </div>
                    <input type="text" class="todo-input ${todo.completed ? 'completed' : ''}" 
                        value="${LifeRPG.security.escapeHtml(todo.text)}" 
                        onchange="updateTodoText(${index}, this.value)"
                        placeholder="输入进展内容...">
                    <div class="todo-delete" onclick="deleteTodoItem(${index})">×</div>
                </div>
            `).join('');

            // 更新隐藏字段的 Markdown 数据
            document.getElementById('todoData').value = todosToMarkdown(currentTodos);
        }

        /**
         * 添加待办项
         */
        function addTodoItem() {
            currentTodos.push({ text: '', completed: false });
            renderTodoList();
            // 聚焦到新添加的输入框
            setTimeout(() => {
                const inputs = document.querySelectorAll('.todo-input');
                if (inputs.length > 0) {
                    inputs[inputs.length - 1].focus();
                }
            }, 0);
        }

        /**
         * 切换待办项完成状态
         */
        function toggleTodoItem(index) {
            if (currentTodos[index]) {
                currentTodos[index].completed = !currentTodos[index].completed;
                renderTodoList();
            }
        }

        /**
         * 更新待办项文本
         */
        function updateTodoText(index, text) {
            if (currentTodos[index]) {
                currentTodos[index].text = text.trim();
                document.getElementById('todoData').value = todosToMarkdown(currentTodos);
            }
        }

        /**
         * 删除待办项
         */
        function deleteTodoItem(index) {
            currentTodos.splice(index, 1);
            renderTodoList();
        }

        /**
         * 加载待办列表
         */
        function loadTodos(markdown) {
            if (!markdown || !markdown.trim()) {
                currentTodos = [];
            } else if (markdown.includes('[ ]') || markdown.includes('[x]') || markdown.includes('[X]')) {
                // 新格式：Markdown 待办列表
                currentTodos = markdownToTodos(markdown);
            } else {
                // 旧格式：纯文本，转换为单条未完成的待办
                currentTodos = [{ text: markdown.trim(), completed: false }];
            }
            renderTodoList();
        }

        // ==================== Excel 导出/导入功能 ====================

        /**
         * 导出待办列表到 Excel
         */
        function exportTodosToExcel() {
            const markdown = todosToMarkdown(currentTodos);
            if (!markdown) {
                showToast('没有待办事项可导出', 'warning');
                return;
            }

            // 创建 CSV 内容（Excel 可以直接打开）
            const csvContent = '待办列表\n' + markdown.split('\n').map(line => {
                const completed = line.startsWith('[x]') || line.startsWith('[X]');
                const text = line.replace(/^\[[ xX]\]\s*/, '');
                return `${completed ? '已完成' : '未完成'},"${text.replace(/"/g, '""')}"`;
            }).join('\n');

            // 下载文件
            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `待办列表_${formatDate(new Date())}.csv`;
            link.click();

            showToast('已导出到 Excel', 'success');
        }

        /**
         * 从 Excel 导入待办列表
         */
        function importTodosFromExcel(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    const lines = content.split('\n').slice(1); // 跳过标题行
                    
                    currentTodos = lines.map(line => {
                        const parts = line.split(',');
                        if (parts.length >= 2) {
                            const completed = parts[0].trim() === '已完成';
                            const text = parts.slice(1).join(',').replace(/^"|"$/g, '').replace(/""/g, '"');
                            return { text, completed };
                        }
                        return null;
                    }).filter(todo => todo && todo.text);

                    renderTodoList();
                    showToast('导入成功', 'success');
                } catch (error) {
                    console.error('导入失败:', error);
                    showToast('导入失败，请检查文件格式', 'warning');
                }
            };
            reader.readAsText(file);
        }

        /**
         * 显示条带悬停提示（显示鼠标所在当天的待办）
         */
        function showStripeTooltip(e) {
            const tooltip = document.getElementById('stripeTooltip');
            const stripe = this;

            // 计算鼠标所在的日期
            const startDateStr = stripe.dataset.startDate;
            const endDateStr = stripe.dataset.endDate;
            const startDate = parseLocalDate(startDateStr);
            const endDate = parseLocalDate(endDateStr);
            const dayCount = Math.round((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;

            const rect = stripe.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const colWidth = rect.width / dayCount;
            const dayOffset = Math.floor(clickX / colWidth);

            const hoveredDate = new Date(startDate.getTime());
            hoveredDate.setDate(startDate.getDate() + dayOffset);
            const hoveredDateStr = formatDate(hoveredDate);

            // 获取该日期的待办
            const checkpointId = stripe.dataset.checkpointId;
            const entries = adminData.calendarEntries[hoveredDateStr] || [];
            const entry = entries.find(e => e.checkpointId === checkpointId);

            if (!entry || !entry.description) {
                tooltip.classList.remove('active');
                return;
            }

            const todos = markdownToTodos(entry.description);
            if (todos.length === 0) {
                tooltip.classList.remove('active');
                return;
            }

            // 生成待办列表 HTML
            let html = '';
            todos.forEach(todo => {
                const icon = todo.completed ? '☑' : '☐';
                const completedClass = todo.completed ? 'completed' : '';
                html += `<div class="tooltip-todo ${completedClass}"><span class="todo-icon">${icon}</span>${LifeRPG.security.escapeHtml(todo.text)}</div>`;
            });

            tooltip.innerHTML = html;
            tooltip.classList.add('active');

            // 定位 tooltip
            const tooltipRect = tooltip.getBoundingClientRect();
            let left = e.clientX + 12;
            let top = e.clientY + 12;

            if (left + tooltipRect.width > window.innerWidth) {
                left = e.clientX - tooltipRect.width - 12;
            }
            if (top + tooltipRect.height > window.innerHeight) {
                top = e.clientY - tooltipRect.height - 12;
            }

            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
        }

        /**
         * 隐藏条带悬停提示
         */
        function hideStripeTooltip() {
            const tooltip = document.getElementById('stripeTooltip');
            tooltip.classList.remove('active');
        }

        /**
         * 关闭弹窗
         */
        function closeModal() {
            try {
                document.getElementById('scrollModal').classList.remove('active');
                // 恢复背景滚动
                document.body.style.overflow = '';
                selectedDate = null;
                editingEntryId = null;
                // 清理状态，防止数据泄露到下一次弹窗
                currentTodos = [];
                currentTags = [];
                // 清理标签点击外部处理器
                if (window._tagClickHandler) {
                    document.removeEventListener('click', window._tagClickHandler);
                    window._tagClickHandler = null;
                }
            } catch (error) {
                console.error('关闭弹窗失败:', error);
            }
        }

        /**
         * 保存条目（铭刻）
         */
        function saveEntry() {
            try {
                if (!selectedDate || !editingEntryId) return;

                const entry = adminData.calendarEntries[selectedDate].find(e => e.id === editingEntryId);
                if (!entry) return;

                entry.description = todosToMarkdown(currentTodos); // 进展记录保存为 Markdown
                entry.tags = currentTags;
                entry.completed = true;

                if (!adminData.checkpointCompletions[entry.checkpointId]) {
                    adminData.checkpointCompletions[entry.checkpointId] = [];
                }

                const existingIndex = adminData.checkpointCompletions[entry.checkpointId]
                    .findIndex(h => h.date === selectedDate);

                if (existingIndex === -1) {
                    adminData.checkpointCompletions[entry.checkpointId].push({
                        date: selectedDate,
                        entryId: entry.id,
                        archived: false
                    });
                }

                saveData();
                renderChamberGrid();
                updateStats();
                closeModal();
            } catch (error) {
                console.error('保存条目失败:', error);
            }
        }

        /**
         * 归档条目
         */
        function archiveEntry() {
            try {
                if (!selectedDate || !editingEntryId) return;

                showConfirmModal({
                    title: '归档卷轴',
                    message: '归档后该检查项将被标记为完成，历史日期的相同检查项将显示删除线。确定要归档吗？',
                    icon: '📦',
                    confirmText: '归档',
                    confirmClass: 'rune-btn-archive',
                    onConfirm: executeArchive
                });
            } catch (error) {
                console.error('归档条目失败:', error);
            }
        }

        /**
         * 执行归档操作
         */
        function executeArchive() {
            try {
                const entry = adminData.calendarEntries[selectedDate].find(e => e.id === editingEntryId);
                if (!entry) return;

                entry.description = todosToMarkdown(currentTodos); // 进展记录保存为 Markdown
                entry.completed = true;
                entry.archived = true;

                if (!adminData.checkpointCompletions[entry.checkpointId]) {
                    adminData.checkpointCompletions[entry.checkpointId] = [];
                }

                adminData.checkpointCompletions[entry.checkpointId].forEach(h => {
                    h.archived = false;
                });

                const existingIndex = adminData.checkpointCompletions[entry.checkpointId]
                    .findIndex(h => h.date === selectedDate);

                if (existingIndex !== -1) {
                    adminData.checkpointCompletions[entry.checkpointId][existingIndex].archived = true;
                } else {
                    adminData.checkpointCompletions[entry.checkpointId].push({
                        date: selectedDate,
                        entryId: entry.id,
                        archived: true
                    });
                }

                saveData();
                renderChamberGrid();
                updateStats();
                closeModal();
            } catch (error) {
                console.error('执行归档失败:', error);
            }
        }

        /**
         * 删除条目
         */
        function deleteEntry() {
            try {
                if (!selectedDate || !editingEntryId) return;

                showConfirmModal({
                    title: '销毁卷轴',
                    message: '确定要销毁此卷轴记录吗？此操作不可恢复。',
                    icon: '🔥',
                    confirmText: '销毁',
                    confirmClass: 'rune-btn-danger',
                    onConfirm: executeDelete
                });
            } catch (error) {
                console.error('删除条目失败:', error);
            }
        }

        /**
         * 执行删除操作
         */
        function executeDelete() {
            try {
                const entry = adminData.calendarEntries[selectedDate].find(e => e.id === editingEntryId);

                adminData.calendarEntries[selectedDate] = adminData.calendarEntries[selectedDate]
                    .filter(e => e.id !== editingEntryId);

                if (adminData.calendarEntries[selectedDate].length === 0) {
                    delete adminData.calendarEntries[selectedDate];
                }

                if (entry && adminData.checkpointCompletions[entry.checkpointId]) {
                    adminData.checkpointCompletions[entry.checkpointId] =
                        adminData.checkpointCompletions[entry.checkpointId].filter(h =>
                            !(h.date === selectedDate && h.entryId === editingEntryId)
                        );
                    if (adminData.checkpointCompletions[entry.checkpointId].length === 0) {
                        delete adminData.checkpointCompletions[entry.checkpointId];
                    }
                }

                saveData();
                renderScrollArchive();
                renderChamberGrid();
                updateStats();
                closeModal();
            } catch (error) {
                console.error('删除条目失败:', error);
            }
        }

        // ==================== 周总结功能 ====================

        let weeklySummaryData = null;

        /**
         * 获取本周周一到周五的日期
         */
        function getWeekDays() {
            const today = new Date();
            const dayOfWeek = today.getDay(); // 0=周日, 1=周一, ..., 6=周六
            const days = [];

            // 计算本周周一的日期
            const monday = new Date(today);
            const diff = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
            monday.setDate(today.getDate() + diff);

            // 生成周一到周五的日期
            for (let i = 0; i < 5; i++) {
                const date = new Date(monday);
                date.setDate(monday.getDate() + i);
                days.push({
                    date: formatDate(date),
                    dayName: ['周一', '周二', '周三', '周四', '周五'][i],
                    isToday: formatDate(date) === formatDate(today)
                });
            }

            return days;
        }

        /**
         * 显示周总结弹窗
         */
        function showWeeklySummary() {
            const weekDays = getWeekDays();
            const summary = weekDays.map(day => {
                const entries = adminData.calendarEntries[day.date] || [];
                let totalTodos = 0;
                let completedTodos = 0;
                let todos = [];

                entries.forEach(entry => {
                    if (entry.description) {
                        const entryTodos = markdownToTodos(entry.description);
                        entryTodos.forEach(todo => {
                            totalTodos++;
                            if (todo.completed) completedTodos++;
                            todos.push({
                                text: todo.text,
                                completed: todo.completed,
                                checkpointName: entry.checkpointName
                            });
                        });
                    }
                });

                return {
                    ...day,
                    entries,
                    totalTodos,
                    completedTodos,
                    todos,
                    completionRate: totalTodos > 0 ? Math.round((completedTodos / totalTodos) * 100) : 0
                };
            });

            weeklySummaryData = summary;
            renderWeeklySummary(summary);
            document.getElementById('weeklySummaryModal').classList.add('active');
        }

        /**
         * 渲染周总结内容（按检查项分组，显示详细待办）
         */
        function renderWeeklySummary(summary) {
            const container = document.getElementById('weeklySummaryContent');

            // 按检查项重新组织数据
            const checkpointMap = new Map();

            summary.forEach(day => {
                day.entries.forEach(entry => {
                    if (!checkpointMap.has(entry.checkpointId)) {
                        checkpointMap.set(entry.checkpointId, {
                            id: entry.checkpointId,
                            name: entry.checkpointName,
                            landmarkName: entry.landmarkName,
                            questName: entry.questName,
                            levelName: entry.levelName,
                            days: {}
                        });
                    }

                    const cp = checkpointMap.get(entry.checkpointId);
                    const todos = entry.description ? markdownToTodos(entry.description) : [];
                    cp.days[day.date] = {
                        dayName: day.dayName,
                        isToday: day.isToday,
                        date: day.date,
                        todos: todos,
                        completed: todos.filter(t => t.completed).length,
                        total: todos.length
                    };
                });
            });



            // 渲染每个检查项（详细版）
            let html = '';
            checkpointMap.forEach(cp => {
                // 生成每天的详细待办列表
                let dayDetailsHtml = '';
                summary.forEach(day => {
                    const dayData = cp.days[day.date];
                    if (dayData && dayData.total > 0) {
                        const todosHtml = dayData.todos.map(todo => `
                            <div class="weekly-detail-todo ${todo.completed ? 'completed' : ''}">
                                <span class="todo-icon">${todo.completed ? '☑' : '☐'}</span>
                                <span class="todo-text">${LifeRPG.security.escapeHtml(todo.text)}</span>
                            </div>
                        `).join('');

                        dayDetailsHtml += `
                            <div class="weekly-detail-section">
                                <div class="weekly-detail-day-header ${day.isToday ? 'today' : ''}">
                                    <span class="weekly-detail-day-name">${day.dayName}</span>
                                    <span class="weekly-detail-day-date">${day.date.slice(5)}</span>
                                </div>
                                <div class="weekly-detail-todos">
                                    ${todosHtml}
                                </div>
                            </div>
                        `;
                    }
                });

                if (!dayDetailsHtml) {
                    dayDetailsHtml = '<div class="weekly-detail-empty">本周暂无待办记录</div>';
                }

                html += `
                    <div class="checkpoint-weekly-card">
                        <div class="checkpoint-weekly-header">
                            <div class="checkpoint-weekly-name">${LifeRPG.security.escapeHtml(cp.name)}</div>
                        </div>
                        <div class="checkpoint-weekly-details">
                            ${dayDetailsHtml}
                        </div>
                    </div>
                `;
            });

            if (checkpointMap.size === 0) {
                html = '<div class="weekly-summary-empty">本周暂无检查项</div>';
            }

            // 添加总体统计（简化版）
            html += `
                <div class="weekly-summary-total">
                    <div style="font-size: 14px; color: var(--text-secondary);">本周共 ${checkpointMap.size} 个项目</div>
                </div>
            `;

            container.innerHTML = html;
        }

        /**
         * 关闭周总结弹窗
         */
        function closeWeeklySummary(event) {
            if (!event || event.target.id === 'weeklySummaryModal' || event.target.classList.contains('close-btn')) {
                document.getElementById('weeklySummaryModal').classList.remove('active');
            }
        }

        /**
         * 导出周总结为 Markdown（按检查项分组，包含详细待办）
         */
        function exportWeeklySummary() {
            if (!weeklySummaryData) return;

            const weekDays = getWeekDays();
            const weekRange = `${weekDays[0].date} ~ ${weekDays[4].date}`;

            // 按检查项重新组织数据
            const checkpointMap = new Map();
            weeklySummaryData.forEach(day => {
                day.entries.forEach(entry => {
                    if (!checkpointMap.has(entry.checkpointId)) {
                        checkpointMap.set(entry.checkpointId, {
                            name: entry.checkpointName,
                            landmarkName: entry.landmarkName,
                            questName: entry.questName,
                            levelName: entry.levelName,
                            days: {}
                        });
                    }
                    const cp = checkpointMap.get(entry.checkpointId);
                    const todos = entry.description ? markdownToTodos(entry.description) : [];
                    cp.days[day.date] = {
                        dayName: day.dayName,
                        todos: todos,
                        completed: todos.filter(t => t.completed).length,
                        total: todos.length
                    };
                });
            });

            let totalAll = 0;
            let completedAll = 0;

            let mdContent = `# 📊 本周项目总结 (${weekRange})\n\n`;

            // 每个项目的详细总结
            let projectIndex = 1;
            checkpointMap.forEach(cp => {
                mdContent += `## ${projectIndex}. ${cp.name}\n\n`;

                // 遍历每天显示待办
                weekDays.forEach(day => {
                    const dayData = cp.days[day.date];
                    if (dayData && dayData.total > 0) {
                        mdContent += `### ${day.dayName} (${day.date})\n\n`;
                        dayData.todos.forEach(todo => {
                            const checkbox = todo.completed ? '[x]' : '[ ]';
                            mdContent += `- ${checkbox} ${todo.text}\n`;
                        });
                        mdContent += `\n`;
                    }
                });

                mdContent += `---\n\n`;
                projectIndex++;
            });

            // 总体统计
            mdContent += `## 📈 本周总体\n\n`;
            mdContent += `- **项目数**: ${checkpointMap.size} 个\n\n`;

            mdContent += `*生成时间: ${new Date().toLocaleString()}*\n`;

            // 下载文件
            const blob = new Blob([mdContent], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `本周项目总结_${weekDays[0].date}_${weekDays[4].date}.md`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('周总结已导出', 'success');
        }

        // ==================== 周总结功能结束 ====================

        /**
         * 切换月份
         */
        function changeMonth(delta) {
            try {
                currentDate.setMonth(currentDate.getMonth() + delta);
                renderChamberGrid();
                updateStats();
            } catch (error) {
                console.error('切换月份失败:', error);
            }
        }

        /**
         * 切换视图
         */
        function switchView(view) {
            try {
                currentView = view;
                document.querySelectorAll('.glyph-btn').forEach(b => b.classList.remove('active'));
                event.target.classList.add('active');
            } catch (error) {
                console.error('切换视图失败:', error);
            }
        }

        /**
         * 更新统计（活跃日、已完成、未完成）
         */
        function updateStats() {
            try {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();

                let completed = 0;
                let pending = 0;
                let activeDays = 0;

                const daysInMonth = new Date(year, month + 1, 0).getDate();
                for (let day = 1; day <= daysInMonth; day++) {
                    const dateStr = formatDate(new Date(year, month, day));
                    const entries = adminData.calendarEntries[dateStr] || [];

                    if (entries.length > 0) {
                        activeDays++;
                        // 统计该日期所有条目的待办完成情况
                        entries.forEach(entry => {
                            if (entry.description) {
                                const todos = markdownToTodos(entry.description);
                                todos.forEach(todo => {
                                    if (todo.completed) {
                                        completed++;
                                    } else {
                                        pending++;
                                    }
                                });
                            }
                        });
                    }
                }

                document.getElementById('statActive').textContent = activeDays;
                document.getElementById('statCompleted').textContent = completed;
                document.getElementById('statPending').textContent = pending;
            } catch (error) {
                console.error('更新统计失败:', error);
            }
        }

        /**
         * 将日期字符串解析为本地日期（避免时区问题）
         * @param {string} dateStr - 格式: "YYYY-MM-DD"
         * @returns {Date} - 本地日期对象
         */
        function parseLocalDate(dateStr) {
            const [year, month, day] = dateStr.split('-').map(Number);
            return new Date(year, month - 1, day); // month 是 0-based
        }

        /**
         * 格式化日期
         */
        function formatDate(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        // 确认弹窗回调函数
        let confirmCallback = null;

        /**
         * 显示确认弹窗
         * @param {Object} options - 配置选项
         * @param {string} options.title - 标题
         * @param {string} options.message - 消息内容
         * @param {string} options.icon - 图标（emoji）
         * @param {string} options.confirmText - 确认按钮文字
         * @param {string} options.confirmClass - 确认按钮样式类
         * @param {Function} options.onConfirm - 确认回调
         * @param {Function} options.onCancel - 取消回调
         */

        /**
         * 显示 Loading 遮罩
         */
        function showLoading(message = '处理中...') {
            let loading = document.getElementById('loadingOverlay');
            if (!loading) {
                loading = document.createElement('div');
                loading.id = 'loadingOverlay';
                loading.innerHTML = `
                    <div class="loading-content">
                        <div class="loading-spinner"></div>
                        <div class="loading-text"></div>
                    </div>
                `;
                document.body.appendChild(loading);
            }
            loading.querySelector('.loading-text').textContent = message;
            loading.classList.add('active');
        }

        /**
         * 隐藏 Loading 遮罩
         */
        function hideLoading() {
            const loading = document.getElementById('loadingOverlay');
            if (loading) {
                loading.classList.remove('active');
            }
        }

        /**
         * 显示 Toast 提示
         * @param {string} message - 提示消息
         * @param {string} type - 类型：'info' | 'warning' | 'success'
         * @param {number} duration - 显示时长（毫秒）
         */
        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer');
            if (!container) {
                console.error('Toast container not found');
                return;
            }

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;

            const iconMap = {
                info: 'ℹ️',
                warning: '⚠️',
                success: '✅'
            };

            toast.innerHTML = `
                <span class="toast-icon">${iconMap[type] || 'ℹ️'}</span>
                <span class="toast-message">${LifeRPG.security.escapeHtml(message)}</span>
            `;

            container.appendChild(toast);

            // 使用 requestAnimationFrame 确保 DOM 更新后再添加动画类
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    toast.classList.add('show');
                });
            });

            // 自动移除
            setTimeout(() => {
                toast.classList.add('hiding');
                toast.classList.remove('show');
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.remove();
                    }
                }, 300);
            }, duration);
        }

        function showConfirmModal(options) {
            const modal = document.getElementById('confirmModal');
            const icon = document.getElementById('confirmIcon');
            const title = document.getElementById('confirmTitle');
            const message = document.getElementById('confirmMessage');
            const okBtn = document.getElementById('confirmOk');

            icon.textContent = options.icon || '⚠️';
            title.textContent = options.title || '确认操作';
            message.textContent = options.message || '确定要执行此操作吗？';
            okBtn.textContent = options.confirmText || '确认';

            // 设置确认按钮样式
            okBtn.className = 'rune-btn ' + (options.confirmClass || 'rune-btn-primary');

            confirmCallback = options.onConfirm || null;

            modal.classList.add('active');

            // 绑定取消回调
            if (options.onCancel) {
                document.getElementById('confirmCancel').onclick = function() {
                    closeConfirmModal();
                    options.onCancel();
                };
            } else {
                document.getElementById('confirmCancel').onclick = closeConfirmModal;
            }
        }

        /**
         * 关闭确认弹窗
         */
        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('active');
            confirmCallback = null;
        }

        /**
         * 执行确认回调
         */
        function executeConfirmCallback() {
            if (confirmCallback) {
                confirmCallback();
            }
            closeConfirmModal();
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            init();

            // 点击遮罩关闭确认弹窗
            document.getElementById('confirmModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeConfirmModal();
                }
            });
        });
    </script>

    <!-- 自定义确认弹窗 -->
    <div class="confirm-modal-overlay" id="confirmModal">
        <div class="confirm-modal">
            <div class="confirm-modal-icon" id="confirmIcon">⚠️</div>
            <div class="confirm-modal-title" id="confirmTitle">确认操作</div>
            <div class="confirm-modal-message" id="confirmMessage">确定要执行此操作吗？</div>
            <div class="confirm-modal-actions">
                <button class="rune-btn rune-btn-secondary" id="confirmCancel" onclick="closeConfirmModal()">取消</button>
                <button class="rune-btn" id="confirmOk" onclick="executeConfirmCallback()">确认</button>
            </div>
        </div>
    </div>

    <!-- 周总结弹窗 -->
    <div class="weekly-summary-overlay" id="weeklySummaryModal" onclick="closeWeeklySummary(event)">
        <div class="weekly-summary-modal" onclick="event.stopPropagation()">
            <div class="weekly-summary-header">
                <h3>📊 本周总结</h3>
                <button class="close-btn" onclick="closeWeeklySummary()">×</button>
            </div>
            <div class="weekly-summary-content" id="weeklySummaryContent">
                <!-- 动态生成 -->
            </div>
            <div class="weekly-summary-actions">
                <button class="rune-btn rune-btn-secondary" onclick="closeWeeklySummary()">关闭</button>
                <button class="rune-btn" onclick="exportWeeklySummary()">📥 导出 Markdown</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- 自定义 Tooltip -->
    <div class="stripe-tooltip" id="stripeTooltip"></div>
</body>
</html>
