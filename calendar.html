                    columns.push(0);
                }

                // 更新该列的结束时间为当前检查项的结束时间
                columns[colIndex] = item.endMinutes;

                positionedEntries.push({
                    ...item,
                    colIndex,
                    totalCols: dayMaxCols  // 使用全天的最大并发数
                });
                console.log(`[WeekView Debug]   -> ${item.entry.checkpointName}: colIndex=${colIndex}, totalCols=${dayMaxCols}`);
            });

            // ========== 步骤3: 渲染条目 ==========
            // 根据计算好的列索引和总列数，计算每个检查项的位置和尺寸
            positionedEntries.forEach(data => {
                const { entry, startTime, duration, startMinutes, endMinutes, stripeClass, colIndex, totalCols } = data;

                // 垂直位置计算（基于时间）
                // 9:00 对应 0%，18:00 对应 100%
                const totalHours = 9;
                const startPercent = Math.max(0, Math.min(100, (startMinutes / 60) / totalHours * 100));
                // 固定最小高度为6%，确保有足够空间显示内容
                const heightPercent = Math.max(6, (duration / 60) / totalHours * 100);

                // 水平位置和宽度计算（基于列索引和总列数）
                // colIndex=0 -> left=0%, colIndex=1 -> left=33.3%, etc.
                // width = 100% / totalCols - 间隙
                const colWidth = 100 / totalCols;
                const leftPercent = colIndex * colWidth;
                // 增加间隙，让检查项之间有明显分隔
                const widthPercent = colWidth - 1.5;

                // 获取待办项
                const todos = entry.description ? markdownToTodos(entry.description) : [];

                // 构建待办项HTML和进度指示器
                let todosHtml = '';
                let progressHtml = '';
                let todoSummaryHtml = '';
                if (todos.length > 0) {
                    const completedCount = todos.filter(t => t.completed).length;

                    // 根据高度和列数决定显示策略
                    // 估算像素高度：假设内容区高度约 450px (9小时 * 50px/小时)
                    const containerHeight = 450;
                    const heightPx = (heightPercent / 100) * containerHeight;

                    // 根据可用高度和总列数决定显示策略
                    let displayStrategy = 'minimal';
                    if (totalCols === 1) {
                        // 单列时可以有更多空间显示待办
                        if (heightPx >= 35) displayStrategy = 'full';
                        else if (heightPx >= 20) displayStrategy = 'summary';
                    } else if (totalCols === 2) {
                        if (heightPx >= 45) displayStrategy = 'full';
                        else if (heightPx >= 25) displayStrategy = 'summary';
                    } else {
                        // 3列及以上，空间较紧
                        if (heightPx >= 55) displayStrategy = 'full';
                        else if (heightPx >= 35) displayStrategy = 'summary';
                    }

                    // 根据策略显示待办
                    if (displayStrategy === 'full') {
                        // 完整显示：显示前3个待办
                        const maxDisplay = Math.min(3, todos.length);
                        const displayTodos = todos.slice(0, maxDisplay);
                        const remainingCount = todos.length - maxDisplay;
                        todosHtml = `
                            <div class="stripe-todos">
                                ${displayTodos.map(todo => `
                                    <span class="stripe-todo ${todo.completed ? 'completed' : ''}" title="${LifeRPG.security.escapeHtml(todo.text)}">${LifeRPG.security.escapeHtml(todo.text)}</span>
                                `).join('')}
                                ${remainingCount > 0 ? `<span class="stripe-todo-more">+${remainingCount}</span>` : ''}
                            </div>
                        `;
                    } else if (displayStrategy === 'summary') {
                        // 摘要显示：只显示第一个待办 + 进度
                        const firstTodo = todos[0];
                        todoSummaryHtml = `
                            <div class="stripe-todo-summary">
                                <span class="stripe-todo ${firstTodo.completed ? 'completed' : ''}">${LifeRPG.security.escapeHtml(firstTodo.text)}</span>
                                ${todos.length > 1 ? `<span class="stripe-todo-more">+${todos.length - 1}</span>` : ''}
                            </div>
                        `;
                    }
                    // minimal 策略：只显示进度，不显示待办详情

                    // 进度显示：完成数/总数
                    progressHtml = `<div class="stripe-progress"><span class="progress-text">${completedCount}/${todos.length}</span></div>`;
                }

                // 根据总列数调整显示
                const nameClass = totalCols >= 3 ? 'stripe-name truncated' : 'stripe-name';
                const nameStyle = totalCols >= 3 ? 'font-size: 8px;' : '';

                html += `
                    <div class="checkpoint-stripe ${stripeClass}"
                         data-checkpoint-id="${entry.checkpointId}"
                         data-entry-id="${entry.id}"
                         data-date="${dateStr}"
                         data-start-time="${startTime}"
                         data-duration="${duration}"
                         style="position: absolute; top: ${startPercent}%; height: ${heightPercent}%; left: ${leftPercent}%; width: ${widthPercent}%;">
                        <div class="resize-handle-bottom" data-resize="bottom"></div>
                        <div class="stripe-header">
                            <span class="${nameClass}" style="${nameStyle}" title="${LifeRPG.security.escapeHtml(entry.checkpointName)}">${LifeRPG.security.escapeHtml(entry.checkpointName)}</span>
                            ${progressHtml}
                        </div>
                        ${todosHtml || todoSummaryHtml}
                    </div>
                `;
            });

            html += '</div>';
            return html;
        }

        /**
         * ============================================================
         * 周视图拖拽和调整大小功能
         * ============================================================
         * 功能：
         * 1. 拖动检查项上下移动，调整开始时间
         * 2. 拖动检查项下边缘，调整持续时间
         * 3. 自动吸附到15分钟刻度
         * 4. 拖动/调整后自动保存并刷新布局
         *
         * 实现原理：
         * - mousedown: 记录初始位置和状态
         * - mousemove: 计算偏移量，实时更新检查项位置
         * - mouseup: 吸附到网格，保存数据，刷新布局
         * ============================================================
         */
        function initWeekViewDragResize() {
            const weekViewBody = document.querySelector('.week-view-body');
            if (!weekViewBody) return;

            let isDragging = false;      // 是否正在拖动
            let isResizing = false;      // 是否正在调整大小
            let dragElement = null;      // 当前拖动的检查项元素
            let resizeElement = null;    // 当前调整大小的检查项元素
            let resizeHandle = null;     // 调整大小的手柄元素
            let startY = 0;              // 鼠标按下时的Y坐标
            let startTop = 0;            // 检查项初始top值（像素）
            let startHeight = 0;         // 检查项初始高度（像素）
            let startDuration = 0;       // 检查项初始持续时间
            let snapIndicator = null;    // 时间吸附指示器元素

            // 创建时间吸附指示器
            function createSnapIndicator() {
                const indicator = document.createElement('div');
                indicator.className = 'time-snap-indicator';
                indicator.style.display = 'none';
                weekViewBody.appendChild(indicator);
                return indicator;
            }

            snapIndicator = createSnapIndicator();

            // 动态更新检查项的待办显示
            function updateStripeTodosDisplay(stripe, heightPx) {
                const entryId = stripe.dataset.entryId;
                const dateStr = stripe.dataset.date;
                const entry = adminData.calendarEntries[dateStr]?.find(e => e.id === entryId);
                if (!entry || !entry.description) return;

                const todos = markdownToTodos(entry.description);
                if (todos.length === 0) return;

                // 根据高度决定显示策略（简化版，只在调整大小时使用）
                let maxTodos = 0;
                if (heightPx >= 25) maxTodos = 1;
                if (heightPx >= 40) maxTodos = 2;
                if (heightPx >= 55) maxTodos = 3;

                const todosContainer = stripe.querySelector('.stripe-todos');
                if (!todosContainer) return;

                if (maxTodos > 0) {
                    const displayTodos = todos.slice(0, maxTodos);
                    const remainingCount = todos.length - maxTodos;
                    todosContainer.innerHTML = `
                        ${displayTodos.map(todo => `
                            <span class="stripe-todo ${todo.completed ? 'completed' : ''}" title="${LifeRPG.security.escapeHtml(todo.text)}">${LifeRPG.security.escapeHtml(todo.text)}</span>
                        `).join('')}
                        ${remainingCount > 0 ? `<span class="stripe-todo-more">+${remainingCount}</span>` : ''}
                    `;
                    todosContainer.style.display = 'flex';
                } else {
                    todosContainer.style.display = 'none';
                }
            }

            // 获取容器高度
            function getContainerHeight() {
                const content = weekViewBody.querySelector('.week-day-content');
                return content ? content.offsetHeight : 400;
            }

            // 像素转换为时间（每15分钟一个刻度）
            function pixelsToTime(px) {
                const containerHeight = getContainerHeight();
                const totalHours = 9 + (px / containerHeight * 9);
                const hour = Math.floor(totalHours);
                const minute = Math.round((totalHours - hour) * 60 / 15) * 15;
                return { hour, minute: Math.min(59, minute) };
            }

            // 时间转换为百分比
            function timeToPercent(hour, minute) {
                return ((hour - 9) + minute / 60) / 9 * 100;
            }

            // 显示吸附指示器
            function showSnapIndicator(px) {
                const containerHeight = getContainerHeight();
                const { hour, minute } = pixelsToTime(px);
                const percent = timeToPercent(hour, minute);
                snapIndicator.style.top = percent + '%';
                snapIndicator.style.display = 'block';
                return { hour, minute, percent };
            }

            // 隐藏吸附指示器
            function hideSnapIndicator() {
                snapIndicator.style.display = 'none';
            }

            // 标记是否发生了拖拽或调整大小操作
            let hasDraggedOrResized = false;

            // 鼠标按下事件
            weekViewBody.addEventListener('mousedown', (e) => {
                const handle = e.target.closest('.resize-handle-top, .resize-handle-bottom');
                const stripe = e.target.closest('.checkpoint-stripe');

                if (handle) {
                    // 开始调整大小 - 只支持下边调整
                    e.preventDefault();
                    e.stopPropagation();
                    hasDraggedOrResized = false;
                    isResizing = true;
                    resizeElement = stripe;
                    resizeHandle = handle;
                    startY = e.clientY;
                    // 使用百分比
                    startTop = parseFloat(stripe.style.top) / 100 * getContainerHeight();
                    startHeight = parseFloat(stripe.style.height) / 100 * getContainerHeight();
                    startDuration = parseInt(stripe.dataset.duration);
                    handle.classList.add('resizing');
                } else if (stripe && !e.target.closest('.resize-handle-top, .resize-handle-bottom')) {
                    // 开始拖拽 - 记录初始位置，但等鼠标移动一定距离才真正开始
                    e.preventDefault();
                    hasDraggedOrResized = false;
                    dragElement = stripe;
                    startY = e.clientY;
                    // 使用百分比
                    startTop = parseFloat(stripe.style.top) / 100 * getContainerHeight();
                    stripe.dataset.dragStartY = e.clientY;
                    stripe.dataset.dragStartTop = startTop;
                }
            });

            // 点击事件 - 用于打开弹窗（只有在没有拖拽/调整大小时才触发）
            weekViewBody.addEventListener('click', (e) => {
                const stripe = e.target.closest('.checkpoint-stripe');
                if (stripe && !hasDraggedOrResized && !isDragging && !isResizing) {
                    const dateStr = stripe.dataset.date;
                    const entryId = stripe.dataset.entryId;
                    openEntryModal(dateStr, entryId);
                }
                // 重置标记
                hasDraggedOrResized = false;
            });

            // 鼠标移动事件
            document.addEventListener('mousemove', (e) => {
                // 处理拖拽启动（需要移动超过5px才真正开始拖拽）
                if (dragElement && !isDragging && !isResizing) {
                    const dragStartY = parseFloat(dragElement.dataset.dragStartY);
                    const deltaY = e.clientY - dragStartY;
                    if (Math.abs(deltaY) > 5) {
                        isDragging = true;
                        dragElement.dataset.dragging = 'true';
                        dragElement.classList.add('dragging');
                        startY = dragStartY;
                        startTop = parseFloat(dragElement.dataset.dragStartTop);
                        // 标记为已拖拽，阻止点击事件
                        hasDraggedOrResized = true;
                    }
                }

                if (isResizing && resizeElement) {
                    hasDraggedOrResized = true;
                    const deltaY = e.clientY - startY;
                    const containerHeight = getContainerHeight();

                    // 只调整高度，不改变位置（只支持下边调整）
                    const newHeightPx = Math.max(20, startHeight + deltaY);
                    const newHeightPercent = (newHeightPx / containerHeight) * 100;
                    resizeElement.style.height = newHeightPercent + '%';

                    // 动态更新待办显示数量
                    updateStripeTodosDisplay(resizeElement, newHeightPx);

                    showSnapIndicator(startTop + newHeightPx);
                } else if (isDragging && dragElement) {
                    hasDraggedOrResized = true;
                    const deltaY = e.clientY - startY;
                    const containerHeight = getContainerHeight();
                    const newTopPx = Math.max(0, startTop + deltaY);
                    const newTopPercent = (newTopPx / containerHeight) * 100;
                    dragElement.style.top = newTopPercent + '%';
                    showSnapIndicator(newTopPx);
                }
            });

            // 鼠标释放事件
            function handleMouseUp(e) {
                const containerHeight = getContainerHeight();

                if (isResizing && resizeElement) {
                    // 计算新的时间（使用百分比）
                    const topPercent = parseFloat(resizeElement.style.top);
                    const heightPercent = parseFloat(resizeElement.style.height);
                    const topPx = topPercent / 100 * containerHeight;
                    const heightPx = heightPercent / 100 * containerHeight;

                    // 只调整持续时间，不改变开始时间
                    const { hour: endHour, minute: endMinute } = pixelsToTime(topPx + heightPx);
                    const { hour: startHour, minute: startMinute } = pixelsToTime(topPx);
                    const newDuration = Math.round(((endHour - startHour) + (endMinute - startMinute) / 60) * 60);
                    resizeElement.dataset.duration = Math.max(15, newDuration);

                    // 吸附到网格
                    const { hour, minute, percent } = showSnapIndicator(topPx);
                    const snappedHeightPercent = Math.max(5, Math.round(heightPercent / 5) * 5);
                    resizeElement.style.height = snappedHeightPercent + '%';

                    // 保存数据
                    saveWeekViewEntryData(resizeElement);

                    resizeHandle.classList.remove('resizing');
                    resizeElement = null;
                    resizeHandle = null;
                    isResizing = false;
                } else if (isDragging && dragElement) {
                    // 吸附到网格
                    const topPercent = parseFloat(dragElement.style.top);
                    const topPx = topPercent / 100 * containerHeight;
                    const { hour, minute, percent } = showSnapIndicator(topPx);
                    dragElement.style.top = percent + '%';

                    // 更新开始时间
                    const newStartTime = `${hour}:${String(minute).padStart(2, '0')}`;
                    dragElement.dataset.startTime = newStartTime;

                    // 保存数据
                    saveWeekViewEntryData(dragElement);

                    // 清除拖拽状态
                    dragElement.classList.remove('dragging');
                    delete dragElement.dataset.dragging;
                    delete dragElement.dataset.dragStartY;
                    delete dragElement.dataset.dragStartTop;
                    dragElement = null;
                    isDragging = false;
                } else if (dragElement && !isDragging) {
                    // 如果没有真正拖拽（移动距离小于阈值），清理状态
                    delete dragElement.dataset.dragStartY;
                    delete dragElement.dataset.dragStartTop;
                    dragElement = null;
                }
                hideSnapIndicator();
            }

            document.addEventListener('mouseup', handleMouseUp);

            // 备用：如果鼠标离开窗口也触发释放
            document.addEventListener('mouseleave', handleMouseUp);

            // 防止内存泄漏，在视图切换时清理
            weekViewBody.dataset.hasDragInit = 'true';
        }

        /**
         * 保存周视图检查项的时间和持续时间数据
         */
        function saveWeekViewEntryData(element) {
            const dateStr = element.dataset.date;
            const entryId = element.dataset.entryId;
            const startTime = element.dataset.startTime;
            const duration = parseInt(element.dataset.duration);

            console.log(`[WeekView] Saving entry ${entryId}: startTime=${startTime}, duration=${duration}`);

            // 更新数据
            if (adminData.calendarEntries[dateStr]) {
                const entry = adminData.calendarEntries[dateStr].find(e => e.id === entryId);
                if (entry) {
                    entry.startTime = startTime;
                    entry.duration = duration;
                    saveData();
                    console.log(`[WeekView] Saved successfully`);

                    // 自动重新渲染该日期的检查项以更新布局
                    refreshWeekViewDayCheckpoints(dateStr);
                }
            }
        }

        /**
         * 刷新周视图某一天的所有检查项显示
         * 用于拖动/调整大小后自动更新布局
         */
        function refreshWeekViewDayCheckpoints(dateStr) {
            const dayColumn = document.querySelector(`.week-day-content[data-date="${dateStr}"]`);
            if (!dayColumn) return;

            // 移除旧的检查项容器
            const oldCheckpoints = dayColumn.querySelector('.week-day-checkpoints');
            if (oldCheckpoints) {
                oldCheckpoints.remove();
            }

            // 重新渲染该日期的检查项
            const newCheckpointsHtml = renderWeekViewCheckpoints(dateStr);
            if (newCheckpointsHtml) {
                dayColumn.insertAdjacentHTML('beforeend', newCheckpointsHtml);
            }

            console.log(`[WeekView] Refreshed checkpoints for ${dateStr}`);
        }

        /**
         * 计算检查点的连续日期范围
         */
        function calculateStripeRanges(checkpointId) {
            const history = getCheckpointHistory(checkpointId);
            if (history.length === 0) return [];

            // 提取所有日期并排序
            const dates = history.map(h => h.date).sort();

            const ranges = [];
            let currentRange = {
                startDate: dates[0],
                endDate: dates[0],
                entries: [history.find(h => h.date === dates[0])]
            };

            for (let i = 1; i < dates.length; i++) {
                const prevDate = parseLocalDate(dates[i - 1]);
                const currDate = parseLocalDate(dates[i]);
                const diffDays = Math.round((currDate - prevDate) / (1000 * 60 * 60 * 24));

                if (diffDays === 1) {
                    // 连续日期，扩展当前范围
                    currentRange.endDate = dates[i];
                    currentRange.entries.push(history.find(h => h.date === dates[i]));
                } else {
                    // 不连续，保存当前范围并开始新范围
                    ranges.push({...currentRange});
                    currentRange = {
                        startDate: dates[i],
                        endDate: dates[i],
                        entries: [history.find(h => h.date === dates[i])]
                    };
                }
            }

            // 保存最后一个范围
            ranges.push(currentRange);

            // 计算每个范围的持续时间
            ranges.forEach(range => {
                range.duration = calculateDuration(range.startDate, range.endDate);
            });

            return ranges;
        }

        /**
         * 根据历时天数获取条带颜色类
         * 天数越长颜色越深（使用当月历时天数，最大31天均匀分布）
         */
        function getStripeColorByDuration(totalDuration) {
            if (totalDuration <= 1) return 'theme-gold-light';      // 1天
            if (totalDuration <= 6) return 'theme-gold';            // 2-6天
            if (totalDuration <= 12) return 'theme-gold-deep';      // 7-12天
            if (totalDuration <= 18) return 'theme-ember';          // 13-18天
            if (totalDuration <= 24) return 'theme-ember-deep';     // 19-24天
            return 'theme-slate';                                    // 25-31天
        }

        /**
         * 渲染检查点条带（分层 Grid 布局，支持 order 排序）
         */
        function renderCheckpointStripes(grid, year, month, firstDayWeekday, daysInMonth) {
            // 构建日期索引映射 - 只包含当月日期
            const dateIndexMap = {};
            for (let day = 1; day <= daysInMonth; day++) {
                const date = new Date(year, month, day);
                const dateStr = formatDate(date);
                const index = firstDayWeekday + (day - 1);
                dateIndexMap[dateStr] = {
                    index: index,
                    row: Math.floor(index / 7),
                    col: index % 7
                };
            }

            // 按行收集所有条带数据
            const rowStripesData = {}; // { rowIndex: [stripeData, ...] }

            // 收集每个检查点的所有条目
            const checkpointData = {};
            Object.keys(adminData.calendarEntries || {}).forEach(dateStr => {
                const entries = adminData.calendarEntries[dateStr];
                entries.forEach(entry => {
                    if (!checkpointData[entry.checkpointId]) {
                        checkpointData[entry.checkpointId] = {
                            name: entry.checkpointName,
                            entries: [],
                            levelId: entry.levelId,
                            questId: entry.questId,
                            landmarkName: entry.landmarkName,
                            questName: entry.questName,
                            levelName: entry.levelName
                        };
                    }
                    checkpointData[entry.checkpointId].entries.push({
                        ...entry,
                        date: dateStr
                    });
                });
            });

            // 为每个检查点计算连续范围并收集条带数据
            Object.keys(checkpointData).forEach(checkpointId => {
                const cpData = checkpointData[checkpointId];
                const ranges = calculateStripeRanges(checkpointId);

                ranges.forEach(range => {
                    // 检查该范围是否与当前月份有交集
                    const rangeStart = parseLocalDate(range.startDate);
                    const rangeEnd = parseLocalDate(range.endDate);
                    const monthStart = new Date(year, month, 1);
                    const monthEnd = new Date(year, month + 1, 0);

                    if (rangeEnd < monthStart || rangeStart > monthEnd) return;

                    const actualStartDate = rangeStart < monthStart ? formatDate(monthStart) : range.startDate;
                    const actualEndDate = rangeEnd > monthEnd ? formatDate(monthEnd) : range.endDate;

                    const startInfo = dateIndexMap[actualStartDate];
                    const endInfo = dateIndexMap[actualEndDate];

                    if (!startInfo || !endInfo) return;

                    const startRow = startInfo.row;
                    const startCol = startInfo.col;
                    const endCol = endInfo.col;
                    const duration = endCol - startCol + 1;

                    const firstEntry = cpData.entries.find(e => e.date === range.startDate);
                    if (!firstEntry) return;

                    // 获取 order 值（用于排序）
                    const order = firstEntry.order || 0;

                    const archiveDate = getCheckpointArchiveDate(checkpointId);
                    const isArchived = !!archiveDate;

                    const history = getCheckpointHistory(checkpointId);
                    const sortedHistory = [...history].sort((a, b) => new Date(a.date) - new Date(b.date));
                    const firstDate = sortedHistory.length > 0 ? sortedHistory[0].date : range.startDate;
                    const lastDate = sortedHistory.length > 0 ? sortedHistory[sortedHistory.length - 1].date : range.startDate;
                    const totalDuration = calculateDuration(firstDate, lastDate);

                    const isContinuous = range.startDate !== range.endDate;

                    let stripeClass = getStripeColorByDuration(duration);
                    if (isContinuous) {
                        stripeClass += ' continuous';
                    }
                    if (isArchived) {
                        stripeClass += ' archived';
                    }

                    let stripeContent;
                    if (isContinuous) {
                        stripeContent = `<span class="stripe-level">${LifeRPG.security.escapeHtml(cpData.levelName)}</span><span class="stripe-separator">›</span><span class="stripe-name">${LifeRPG.security.escapeHtml(cpData.name)}</span><span class="stripe-duration">${totalDuration}天</span>`;
                    } else {
                        stripeContent = `<span class="stripe-name">${LifeRPG.security.escapeHtml(cpData.name)}</span><span class="stripe-duration">${totalDuration}天</span>`;
                    }

                    // 收集条带数据
                    if (!rowStripesData[startRow]) rowStripesData[startRow] = [];
                    rowStripesData[startRow].push({
                        checkpointId,
                        startCol,
                        endCol,
                        order,
                        stripeClass,
                        stripeContent,
                        range,
                        cpData,
                        firstEntry,
                        isArchived,
                        totalDuration
                    });
                });
            });

            // 按行渲染条带，根据 order 排序
            Object.keys(rowStripesData).forEach(rowIndex => {
                const stripes = rowStripesData[rowIndex];

                // 按 order 排序，order 相同则按 startCol 排序
                stripes.sort((a, b) => {
                    if (a.order !== b.order) return a.order - b.order;
                    return a.startCol - b.startCol;
                });

                // 分配 level（考虑重叠）
                const occupied = []; // [{level, startCol, endCol}]
                stripes.forEach(stripeData => {
                    let level = 1;
                    let found = false;
                    while (!found) {
                        const conflict = occupied.some(o =>
                            o.level === level &&
                            !(stripeData.endCol < o.startCol || stripeData.startCol > o.endCol)
                        );
                        if (!conflict) {
                            found = true;
                        } else {
                            level++;
                        }
                    }
                    occupied.push({ level, startCol: stripeData.startCol, endCol: stripeData.endCol });
                    stripeData.level = level;
                });

                // 创建条带元素
                stripes.forEach(stripeData => {
                    const stripe = createStripeElement(stripeData, rowIndex);

                    // 添加到对应行的条带容器
                    const rowStripesContainer = grid.querySelector(`.row-stripes[data-row="${rowIndex}"]`);
                    if (rowStripesContainer) {
                        rowStripesContainer.appendChild(stripe);
                    }
                });
            });
        }

        /**
         * 创建条带元素
         */
        function createStripeElement(stripeData, rowIndex) {
            const {
                checkpointId, startCol, endCol, level, order,
                stripeClass, stripeContent, range, cpData, firstEntry
            } = stripeData;

            const stripe = document.createElement('div');
            stripe.className = `checkpoint-stripe ${stripeClass}`;
            stripe.innerHTML = stripeContent;
            stripe.draggable = true;
            stripe.style.setProperty('--start', startCol + 1);
            stripe.style.setProperty('--end', endCol + 2);
            stripe.style.setProperty('--level', level);
            stripe.dataset.checkpointId = checkpointId;
            stripe.dataset.startDate = range.startDate;
            stripe.dataset.endDate = range.endDate;
            stripe.dataset.entryId = firstEntry.id;
            stripe.dataset.levelId = cpData.levelId;
            stripe.dataset.questId = cpData.questId;
            stripe.dataset.landmark = LifeRPG.security.escapeHtml(cpData.landmarkName);
            stripe.dataset.quest = LifeRPG.security.escapeHtml(cpData.questName);
            stripe.dataset.level = LifeRPG.security.escapeHtml(cpData.levelName);
            stripe.dataset.cpName = LifeRPG.security.escapeHtml(cpData.name);
            stripe.dataset.sourceDate = range.startDate;
            stripe.dataset.rowIndex = rowIndex;
            stripe.dataset.order = order;

            // 悬停显示自定义 tooltip
            stripe.addEventListener('mousemove', showStripeTooltip);
            stripe.addEventListener('mouseleave', hideStripeTooltip);

            // 点击打开弹窗
            stripe.onclick = function(e) {
                e.stopPropagation();

                const startDateStr = this.dataset.startDate;
                const endDateStr = this.dataset.endDate;
                const startDate = parseLocalDate(startDateStr);
                const endDate = parseLocalDate(endDateStr);
                const dayCount = Math.round((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;

                const rect = this.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const colWidth = rect.width / dayCount;
                const clickedDayOffset = Math.floor(clickX / colWidth);

                const clickedDate = new Date(startDate.getTime());
                clickedDate.setDate(startDate.getDate() + clickedDayOffset);
                const clickedDateStr = formatDate(clickedDate);

                const entries = adminData.calendarEntries[clickedDateStr] || [];
                const entry = entries.find(e => e.checkpointId === checkpointId);

                if (entry) {
                    openEntryModal(clickedDateStr, entry.id);
                } else {
                    openEntryModal(startDateStr, firstEntry.id);
                }
            };

            // 条带拖拽排序事件
            stripe.addEventListener('mousedown', onStripeDragStart);

            // 跨格子拖动事件
            stripe.addEventListener('dragstart', onStripeCrossCellDragStart);
            stripe.addEventListener('dragend', onStripeCrossCellDragEnd);

            return stripe;
        }

        /**
         * 条带拖拽排序 - 开始
         */
        function onStripeDragStart(e) {
            // 只响应左键
            if (e.button !== 0) return;

            const stripe = e.currentTarget;
            const rowIndex = stripe.dataset.rowIndex;
            const rowContainer = document.querySelector(`.row-stripes[data-row="${rowIndex}"]`);

            if (!rowContainer) return;

            console.log('[StripeDrag] mousedown on stripe:', stripe.dataset.cpName);

            // 记录初始状态，但不立即启动排序
            // 排序只在垂直移动超过阈值时才启动
            stripeDragState.potentialDrag = true;
            stripeDragState.draggedStripe = stripe;
            stripeDragState.startY = e.clientY;
            stripeDragState.startX = e.clientX;
            stripeDragState.startLevel = parseInt(stripe.style.getPropertyValue('--level'));
            stripeDragState.rowStripesContainer = rowContainer;
            stripeDragState.sourceRowIndex = rowIndex;

            // 绑定全局事件
            document.addEventListener('mousemove', onStripeDragMove);
            document.addEventListener('mouseup', onStripeDragEnd);

            // 不要调用 e.preventDefault()，否则会影响 dragstart 事件
        }

        /**
         * 条带拖拽排序 - 移动
         */
        function onStripeDragMove(e) {
            // 如果还没有启动排序，检查是否满足启动条件
            if (stripeDragState.potentialDrag && !stripeDragState.isDragging) {
                const deltaY = Math.abs(e.clientY - stripeDragState.startY);
                const deltaX = Math.abs(e.clientX - stripeDragState.startX);

                console.log('[StripeDrag] mousemove deltaX:', deltaX, 'deltaY:', deltaY);

                // 如果水平移动超过垂直移动，可能是跨格子拖动，取消排序
                if (deltaX > deltaY && deltaX > 10) {
                    console.log('[StripeDrag] Horizontal move detected, canceling reorder for cross-cell drag');
                    // 取消排序，让 HTML5 drag 接管
                    cleanupStripeDragState();
                    return;
                }

                // 垂直移动超过阈值，启动排序
                if (deltaY > 5) {
                    console.log('[StripeDrag] Vertical move detected, starting reorder');
                    stripeDragState.isDragging = true;
                    stripeDragState.draggedStripe.classList.add('dragging');

                    // 创建放置指示器
                    const indicator = document.createElement('div');
                    indicator.className = 'stripe-drop-indicator';
                    indicator.style.display = 'none';
                    stripeDragState.rowStripesContainer.appendChild(indicator);
                    stripeDragState.dropIndicator = indicator;
                } else {
                    return; // 还没有决定是排序还是跨格子拖动
                }
            }

            if (!stripeDragState.isDragging) return;

            const { draggedStripe, rowStripesContainer, dropIndicator } = stripeDragState;

            // 检查鼠标是否移出了当前行容器
            const containerRect = rowStripesContainer.getBoundingClientRect();
            if (e.clientX < containerRect.left || e.clientX > containerRect.right ||
                e.clientY < containerRect.top || e.clientY > containerRect.bottom) {
                // 鼠标移出容器，取消排序
                cleanupStripeDragState();
                return;
            }

            // 获取容器内所有条带（包括正在拖拽的，用于计算总数）
            const allStripes = [...rowStripesContainer.querySelectorAll('.checkpoint-stripe')];
            const totalStripes = allStripes.length;

            // 计算目标位置
            const relativeY = e.clientY - containerRect.top;

            // 计算实际条带高度（包含 gap）
            // grid-auto-rows: 20px, gap: 2px 0
            const rowHeight = 20;
            const gap = 2;
            const totalRowHeight = rowHeight + gap;

            // 最大层级 = 总条带数 + 1（可以拖到最后一行之后）
            const maxLevel = totalStripes + 1;

            // 计算目标层级（1-based）
            let targetLevel = Math.floor(relativeY / totalRowHeight) + 1;
            targetLevel = Math.max(1, Math.min(maxLevel, targetLevel));

            stripeDragState.targetLevel = targetLevel;

            // 显示放置指示器（放在条带之间的间隙位置）
            // 第 N 行的指示器位置 = (N-1) * 行高
            const indicatorTop = (targetLevel - 1) * totalRowHeight;
            dropIndicator.style.display = 'block';
            // 允许指示器显示在容器边界外（方便拖到最后一行之后）
            dropIndicator.style.top = Math.max(-2, indicatorTop) + 'px';
        }

        /**
         * 清理条带拖拽状态
         */
        function cleanupStripeDragState() {
            const { draggedStripe, dropIndicator } = stripeDragState;

            if (draggedStripe) {
                draggedStripe.classList.remove('dragging');
            }

            if (dropIndicator) {
                dropIndicator.remove();
            }

            stripeDragState = {
                isDragging: false,
                potentialDrag: false,
                draggedStripe: null,
                startY: 0,
                startX: 0,
                startLevel: 0,
                rowStripesContainer: null,
                dropIndicator: null,
                targetLevel: null
            };

            document.removeEventListener('mousemove', onStripeDragMove);
            document.removeEventListener('mouseup', onStripeDragEnd);
        }

        /**
         * 条带拖拽排序 - 结束
         */
        function onStripeDragEnd(e) {
            if (!stripeDragState.isDragging) return;

            const { draggedStripe, rowStripesContainer, dropIndicator, targetLevel, startLevel } = stripeDragState;

            // 清理拖拽状态
            draggedStripe.classList.remove('dragging');
            if (dropIndicator) {
                dropIndicator.remove();
            }

            // 如果位置有变化，执行重排
            if (targetLevel && targetLevel !== startLevel) {
                reorderStripesInRow(rowStripesContainer, draggedStripe, targetLevel);
            }

            // 使用通用清理函数
            cleanupStripeDragState();
        }

        /**
         * 条带跨格子拖动 - 开始
         */
        function onStripeCrossCellDragStart(e) {
            const stripe = e.currentTarget;

            console.log('[CrossCell] dragstart on stripe:', stripe.dataset.cpName);

            // 设置 draggedCheckpoint 用于跨格子拖放
            draggedCheckpoint = {
                id: stripe.dataset.checkpointId,
                levelId: stripe.dataset.levelId,
                questId: stripe.dataset.questId,
                name: stripe.dataset.cpName,
                landmark: stripe.dataset.landmark,
                quest: stripe.dataset.quest,
                level: stripe.dataset.level,
                sourceDate: stripe.dataset.sourceDate,
                isMoving: true,
                isStripe: true
            };

            stripe.classList.add('dragging');
            document.body.classList.add('dragging');
        }

        /**
         * 条带跨格子拖动 - 结束
         */
        function onStripeCrossCellDragEnd(e) {
            const stripe = e.currentTarget;
            stripe.classList.remove('dragging');
            document.body.classList.remove('dragging');
            draggedCheckpoint = null;
        }

        /**
         * 重排行内条带顺序
         */
        function reorderStripesInRow(rowContainer, draggedStripe, targetLevel) {
            const checkpointId = draggedStripe.dataset.checkpointId;
            const startDate = draggedStripe.dataset.startDate;
            const endDate = draggedStripe.dataset.endDate;

            // 获取当前所有条带（按当前DOM顺序）
            const allStripes = [...rowContainer.querySelectorAll('.checkpoint-stripe')];
            const draggedIndex = allStripes.indexOf(draggedStripe);

            // 如果找不到拖拽的条带，退出
            if (draggedIndex === -1) {
                console.error('找不到拖拽的条带，可能DOM已变化');
                return;
            }

            // 重新排序条带数组
            allStripes.splice(draggedIndex, 1);
            allStripes.splice(targetLevel - 1, 0, draggedStripe);

            // 收集新的顺序映射 {checkpointId: newOrder}
            // 注意：同一个 checkpointId 在同一天内可能出现多次（跨天条带分段显示）
            const newOrderMap = {};
            allStripes.forEach((stripe, index) => {
                const cpId = stripe.dataset.checkpointId;
                // 使用第一次出现的索引作为 order（因为跨天条带的所有分段应该共享同一个 order）
                if (!newOrderMap.hasOwnProperty(cpId)) {
                    newOrderMap[cpId] = index;
                }
            });

            // 更新所有条带所有日期的 entry order
            allStripes.forEach(stripe => {
                const cpId = stripe.dataset.checkpointId;
                const sDate = stripe.dataset.startDate;
                const eDate = stripe.dataset.endDate;
                const newOrder = newOrderMap[cpId];

                let curr = parseLocalDate(sDate);
                const end = parseLocalDate(eDate);
                while (curr <= end) {
                    const dateStr = formatDate(new Date(curr));
                    const entries = adminData.calendarEntries[dateStr];
                    if (entries) {
                        const entry = entries.find(e => e.checkpointId === cpId);
                        if (entry) {
                            entry.order = newOrder;
                        }
                    }
                    curr.setDate(curr.getDate() + 1);
                }
            });

            // 保存数据
            saveData();

            // 重新渲染整个日历（确保跨天条带的所有部分都更新）
            renderChamberGrid();

            // 显示提示
            showToast('条带顺序已更新', 'success');
        }



        /**
         * 绑定密室拖拽事件
         */
        function bindChamberDragEvents() {
            try {
                const chambers = document.querySelectorAll('.time-chamber');
                chambers.forEach(chamber => {
                    LifeRPG.events.add(chamber, 'dragover', function(e) {
                        e.preventDefault();
                        this.classList.add('drag-over');
                    });

                    LifeRPG.events.add(chamber, 'dragleave', function() {
                        this.classList.remove('drag-over');
                    });

                    LifeRPG.events.add(chamber, 'drop', function(e) {
                        e.preventDefault();
                        this.classList.remove('drag-over');

                        console.log('[Drop] drop event fired, draggedCheckpoint:', draggedCheckpoint);

                        if (!draggedCheckpoint) return;

                        const dateStr = this.dataset.date;

                        console.log('[Drop] target date:', dateStr, 'source date:', draggedCheckpoint.sourceDate);

                        // 如果是条带拖动
                        if (draggedCheckpoint.isStripe) {
                            // 如果是同一日期，不处理（让排序逻辑处理或忽略）
                            if (draggedCheckpoint.sourceDate === dateStr) {
                                console.log('[Drop] Same date, ignoring');
                                draggedCheckpoint = null;
                                return;
                            }
                            // 跨格子拖动，继续执行创建新记录逻辑
                            console.log('[Drop] Cross-cell drag detected, creating new entry');
                        }

                        // 检查该日期是否已有相同检查项
                        const existingEntries = adminData.calendarEntries[dateStr] || [];
                        const hasDuplicate = existingEntries.some(entry =>
                            entry.checkpointId === draggedCheckpoint.id
                        );

                        if (hasDuplicate) {
                            showToast(`该日期已存在「${draggedCheckpoint.name}」检查项`, 'warning');
                            draggedCheckpoint = null;
                            return;
                        }

                        const entry = {
                            id: generateId(),
                            checkpointId: draggedCheckpoint.id,
                            levelId: draggedCheckpoint.levelId,
                            questId: draggedCheckpoint.questId,
                            checkpointName: draggedCheckpoint.name,
                            landmarkName: draggedCheckpoint.landmark,
                            questName: draggedCheckpoint.quest,
                            levelName: draggedCheckpoint.level,
                            date: dateStr,
                            description: '',
                            completed: false
                        };

                        if (!adminData.calendarEntries[dateStr]) {
                            adminData.calendarEntries[dateStr] = [];
                        }
                        adminData.calendarEntries[dateStr].push(entry);

                        if (!adminData.checkpointCompletions[draggedCheckpoint.id]) {
                            adminData.checkpointCompletions[draggedCheckpoint.id] = [];
                        }
                        adminData.checkpointCompletions[draggedCheckpoint.id].push({
                            date: dateStr,
                            entryId: entry.id,
                            archived: false
                        });

                        saveData();
                        renderScrollArchive();
                        renderChamberGrid();
                        updateStats();
                        // 不自动打开弹窗，用户需要编辑时可点击条带打开
                    });
                });
            } catch (error) {
                console.error('绑定密室拖拽事件失败:', error);
            }
        }

        /**
         * 移动历史未完成的待办到今天
         */
        async function moveUnfinishedTodosToToday(checkpointId, todayStr) {
            const history = getCheckpointHistory(checkpointId);
            if (history.length === 0) return;

            let hasMoved = false;
            const todayEntry = adminData.calendarEntries[todayStr]?.find(e => e.checkpointId === checkpointId);
            if (!todayEntry) return;

            // 获取今天的待办列表
            let todayTodos = todayEntry.description ? markdownToTodos(todayEntry.description) : [];

            // 遍历历史记录，查找未完成的待办
            for (const record of history) {
                if (record.date === todayStr) continue; // 跳过今天

                const entries = adminData.calendarEntries[record.date] || [];
                const entry = entries.find(e => e.checkpointId === checkpointId);
                if (!entry || !entry.description) continue;

                const todos = markdownToTodos(entry.description);
                const unfinishedTodos = todos.filter(t => !t.completed);

                if (unfinishedTodos.length > 0) {
                    // 将未完成的待办移动到今天
                    todayTodos = [...todayTodos, ...unfinishedTodos];

                    // 从历史记录中移除已移动的待办（标记为完成）
                    const finishedTodos = todos.filter(t => t.completed);
                    entry.description = todosToMarkdown(finishedTodos);

                    hasMoved = true;
                }
            }

            if (hasMoved) {
                // 更新今天的待办
                todayEntry.description = todosToMarkdown(todayTodos);
                saveData();

                // 显示提示
                showToast('已将历史未完成的待办移动到今日', 'success');
            }
        }

        /**
         * 打开编辑弹窗
         */
        async function openEntryModal(dateStr, entryId) {
            try {
                event.stopPropagation();
                selectedDate = dateStr;
                editingEntryId = entryId;

                // 检查是否是今天，如果是则移动历史未完成的待办
                const todayStr = formatDate(new Date());
                if (dateStr === todayStr) {
                    showLoading('正在检查历史待办...');
                    await moveUnfinishedTodosToToday(entryId, dateStr);
                    hideLoading();
                }

                const entry = adminData.calendarEntries[dateStr].find(e => e.id === entryId);
                if (!entry) return;

                const date = new Date(dateStr);
                document.getElementById('modalDate').textContent =
                    `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;

                document.getElementById('modalCheckpoint').innerHTML = `
                    ${LifeRPG.security.escapeHtml(entry.checkpointName)}
                    <span class="breadcrumb-path">${LifeRPG.security.escapeHtml(entry.landmarkName)} › ${LifeRPG.security.escapeHtml(entry.questName)} › ${LifeRPG.security.escapeHtml(entry.levelName)}</span>
                `;

                // 加载待办列表（优先使用 entry.todos，兼容旧数据 entry.description）
                loadTodos(entry.todos || entry.description || '');

                const history = getCheckpointHistory(entry.checkpointId);
                const sortedHistory = [...history].sort((a, b) => new Date(a.date) - new Date(b.date));
                const firstDate = sortedHistory.length > 0 ? sortedHistory[0].date : selectedDate;
                const lastDate = sortedHistory.length > 0 ? sortedHistory[sortedHistory.length - 1].date : selectedDate;
                const totalDuration = calculateDuration(firstDate, lastDate);
                document.getElementById('totalDurationDisplay').textContent = totalDuration + ' 天';

                const actualDuration = history.length;
                document.getElementById('actualDurationDisplay').textContent = actualDuration + ' 天';

                renderHistoryTimeline(entry.checkpointId, selectedDate);

                const archiveBtn = document.getElementById('archiveBtn');
                const archiveDate = getCheckpointArchiveDate(entry.checkpointId);
                const isArchivedOnThisDay = archiveDate === dateStr;

                if (isArchivedOnThisDay) {
                    archiveBtn.textContent = '✓ 已归档';
                    archiveBtn.classList.add('archived');
                    archiveBtn.title = '该检查项已在此日期归档';
                } else if (archiveDate) {
                    archiveBtn.textContent = '已归档于 ' + archiveDate;
                    archiveBtn.classList.add('archived');
                    archiveBtn.disabled = true;
                    archiveBtn.title = `该检查项已于 ${archiveDate} 归档`;
                } else {
                    archiveBtn.textContent = '归档';
                    archiveBtn.classList.remove('archived');
                    archiveBtn.disabled = false;
                    archiveBtn.title = '归档后该检查项将被标记为完成，历史日期的相同检查项将显示删除线';
                }

                document.getElementById('deleteBtn').style.display = 'block';

                // 加载标签
                loadCheckpointTags(entry.checkpointId, entry.tags || entry.tag);

                // 更新复制和改期按钮文字（周五显示"到下周一"）
                const copyBtn = document.getElementById('copyNextBtn');
                const moveBtn = document.getElementById('moveNextBtn');
                const currentDay = date.getDay();
                copyBtn.textContent = currentDay === 5 ? '📋 复制到下周一' : '📋 复制到下一天';
                moveBtn.textContent = currentDay === 5 ? '📅 改到下周一' : '📅 改到下一天';

                // 禁止背景滚动
                document.body.style.overflow = 'hidden';
                document.getElementById('scrollModal').classList.add('active');
            } catch (error) {
                console.error('打开编辑弹窗失败:', error);
            }
        }

        /**
         * 计算两个日期之间的天数
         */
        function calculateDuration(startDateStr, endDateStr) {
            const start = parseLocalDate(startDateStr);
            const end = parseLocalDate(endDateStr);
            const diffTime = Math.abs(end - start);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
            return diffDays;
        }

        /**
         * 渲染历史时间轴
         */
        function renderHistoryTimeline(checkpointId, currentDateStr) {
            try {
                const history = getCheckpointHistory(checkpointId);
                const timeline = document.getElementById('historyTimeline');
                const emptyState = document.getElementById('timelineEmpty');

                if (!timeline) return;

                if (history.length === 0) {
                    timeline.innerHTML = '';
                    if (emptyState) emptyState.style.display = 'block';
                    return;
                }

                if (emptyState) emptyState.style.display = 'none';

                const sortedHistory = [...history].sort((a, b) =>
                    new Date(a.date) - new Date(b.date)
                );

                let html = '';
                sortedHistory.forEach(h => {
                    const entry = findEntryById(h.date, h.entryId);
                    if (!entry) return;

                    const isCompleted = entry.completed || h.completed;
                    console.log('时间轴渲染:', h.date, 'entry.completed:', entry.completed, 'h.completed:', h.completed, 'isCompleted:', isCompleted);
                    const dateLabel = '';

                    // 获取标签数组（兼容新旧数据）
                    let tags = [];
                    if (entry.tags && Array.isArray(entry.tags)) {
                        tags = entry.tags;
                    } else if (entry.tag) {
                        tags = [entry.tag];
                    }
                    const tagsHtml = tags.map(tag =>
                        `<span class="timeline-tag">${LifeRPG.security.escapeHtml(tag)}</span>`
                    ).join('');

                    // 解析待办列表并格式化显示
                    let todosHtml = '';
                    if (entry.description) {
                        const todos = markdownToTodos(entry.description);
                        if (todos.length > 0) {
                            todosHtml = '<div class="timeline-todos">' + 
                                todos.map(todo => `
                                    <div class="timeline-todo ${todo.completed ? 'completed' : ''}">
                                        ${todo.completed ? '☑' : '☐'} ${LifeRPG.security.escapeHtml(todo.text)}
                                    </div>
                                `).join('') + 
                                '</div>';
                        } else {
                            todosHtml = `<span class="timeline-empty">${LifeRPG.security.escapeHtml(entry.description)}</span>`;
                        }
                    } else {
                        todosHtml = '<span class="timeline-empty">暂无记录</span>';
                    }

                    html += `
                        <div class="timeline-item ${isCompleted ? 'completed' : 'pending'}">
                            <div class="timeline-date">${h.date}${dateLabel}</div>
                            <div class="timeline-desc">
                                ${tagsHtml}
                                ${todosHtml}
                            </div>
                        </div>
                    `;
                });

                timeline.innerHTML = html || '<div class="timeline-empty">暂无历史记录</div>';
            } catch (error) {
                console.error('渲染历史时间轴失败:', error);
            }
        }

        /**
         * 根据日期和条目ID查找条目
         */
        function findEntryById(dateStr, entryId) {
            const entries = adminData.calendarEntries[dateStr] || [];
            return entries.find(e => e.id === entryId);
        }

        /**
         * 复制到下一天（周五则复制到下周一）
         */
        // 复制功能的临时数据存储
        let copyTempData = null;

        function copyToNextDay() {
            try {
                if (!selectedDate || !editingEntryId) return;

                // 先获取当前条目和日期（在保存之前，因为saveEntry会关闭弹窗清理状态）
                const entry = adminData.calendarEntries[selectedDate]?.find(e => e.id === editingEntryId);
                if (!entry) return;
                const currentDateStr = selectedDate;

                // 计算下一天日期（使用本地时间避免时区问题）
                const currentDate = parseLocalDate(currentDateStr);
                let nextDate = new Date(currentDate);
                nextDate.setDate(currentDate.getDate() + 1);

                // 如果是周五(5)，则跳到下周一(增加3天)
                if (currentDate.getDay() === 5) {
                    nextDate.setDate(currentDate.getDate() + 3);
                }

                const nextDateStr = formatDate(nextDate);

                // 检查下一天是否已有相同检查点的记录
                const nextDayEntries = adminData.calendarEntries[nextDateStr] || [];
                const existingEntry = nextDayEntries.find(e => e.checkpointId === entry.checkpointId);

                // 调试日志：帮助排查数据问题
                console.log('复制检查:', {
                    nextDateStr,
                    nextDayEntries,
                    checkpointId: entry.checkpointId,
                    existingEntry
                });

                if (existingEntry) {
                    // 存储临时数据
                    copyTempData = { entry, nextDateStr, existingEntry, isNew: false };
                    showConfirmModal({
                        title: '覆盖确认',
                        message: `${nextDateStr} 已有该检查点的记录，是否覆盖？`,
                        icon: '⚠️',
                        confirmText: '覆盖',
                        confirmClass: 'rune-btn-danger',
                        onConfirm: executeCopy
                    });
                } else {
                    // 存储临时数据
                    copyTempData = { entry, nextDateStr, existingEntry: null, isNew: true };
                    executeCopy();
                }

            } catch (error) {
                console.error('复制到下一天失败:', error);
                showConfirmModal({
                    title: '复制失败',
                    message: '复制失败: ' + error.message,
                    icon: '❌',
                    confirmText: '确定',
                    onConfirm: () => {}
                });
            }
        }

        /**
         * 执行复制操作
         */
        function executeCopy() {
            if (!copyTempData) return;

            const { entry, nextDateStr, existingEntry, isNew } = copyTempData;

            if (existingEntry) {
                // 覆盖现有记录（不复制描述，只复制标签）
                existingEntry.tags = entry.tags || (entry.tag ? [entry.tag] : []);

                // 确保 checkpointCompletions 中也有对应的记录（处理旧数据不一致的情况）
                if (!adminData.checkpointCompletions[entry.checkpointId]) {
                    adminData.checkpointCompletions[entry.checkpointId] = [];
                }
                const historyRecord = adminData.checkpointCompletions[entry.checkpointId]
                    .find(h => h.date === nextDateStr && h.entryId === existingEntry.id);
                if (!historyRecord) {
                    adminData.checkpointCompletions[entry.checkpointId].push({
                        date: nextDateStr,
                        entryId: existingEntry.id,
                        completed: existingEntry.completed || false
                    });
                }
            } else {
                // 创建新记录（不复制描述，只复制标签）
                const newEntry = {
                    id: generateId(),
                    checkpointId: entry.checkpointId,
                    checkpointName: entry.checkpointName,
                    landmarkId: entry.landmarkId,
                    landmarkName: entry.landmarkName,
                    questId: entry.questId,
                    questName: entry.questName,
                    levelId: entry.levelId,
                    levelName: entry.levelName,
                    description: '',
                    tags: entry.tags || (entry.tag ? [entry.tag] : []),
                    completed: false,
                    createdAt: new Date().toISOString()
                };

                if (!adminData.calendarEntries[nextDateStr]) {
                    adminData.calendarEntries[nextDateStr] = [];
                }
                adminData.calendarEntries[nextDateStr].push(newEntry);

                // 同步创建 checkpointCompletions 记录，使条带能正确渲染
                if (!adminData.checkpointCompletions[entry.checkpointId]) {
                    adminData.checkpointCompletions[entry.checkpointId] = [];
                }
                adminData.checkpointCompletions[entry.checkpointId].push({
                    date: nextDateStr,
                    entryId: newEntry.id,
                    completed: false
                });
            }

            saveData();

            // 刷新日历视图
            renderChamberGrid();

            // 显示成功提示
            const btn = document.getElementById('copyNextBtn');
            const originalText = btn.textContent;
            btn.textContent = '✓ 已复制';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 1500);

            // 关闭弹窗
            closeModal();

            copyTempData = null;
        }

        // 改期功能的临时数据存储
        let moveTempData = null;

        /**
         * 改期到下一天（周五则改到下周一）
         */
        function moveToNextDay() {
            try {
                if (!selectedDate || !editingEntryId) return;

                // 先获取当前条目和日期（在保存之前）
                const entry = adminData.calendarEntries[selectedDate]?.find(e => e.id === editingEntryId);
                if (!entry) return;
                const currentDateStr = selectedDate;

                // 计算下一天日期（使用本地时间避免时区问题）
                const currentDate = parseLocalDate(currentDateStr);
                let nextDate = new Date(currentDate);
                nextDate.setDate(currentDate.getDate() + 1);

                // 如果是周五(5)，则跳到下周一(增加3天)
                if (currentDate.getDay() === 5) {
                    nextDate.setDate(currentDate.getDate() + 3);
                }

                const nextDateStr = formatDate(nextDate);

                // 检查下一天是否已有相同检查点的记录
                const nextDayEntries = adminData.calendarEntries[nextDateStr] || [];
                const existingEntry = nextDayEntries.find(e => e.checkpointId === entry.checkpointId);

                if (existingEntry) {
                    // 存储临时数据
                    moveTempData = { entry, currentDateStr, nextDateStr, existingEntry, isNew: false };
                    showConfirmModal({
                        title: '覆盖确认',
                        message: `${nextDateStr} 已有该检查点的记录，是否覆盖并删除原日期的记录？`,
                        icon: '⚠️',
                        confirmText: '覆盖并移动',
                        confirmClass: 'rune-btn-danger',
                        onConfirm: executeMove
                    });
                } else {
                    // 存储临时数据
                    moveTempData = { entry, currentDateStr, nextDateStr, existingEntry: null, isNew: true };
                    executeMove();
                }

            } catch (error) {
                console.error('改期失败:', error);
                showConfirmModal({
                    title: '改期失败',
                    message: '改期失败: ' + error.message,
                    icon: '❌',
                    confirmText: '确定',
                    onConfirm: () => {}
                });
            }
        }

        /**
         * 执行改期操作
         */
        function executeMove() {
            if (!moveTempData) return;

            const { entry, currentDateStr, nextDateStr, existingEntry, isNew } = moveTempData;

            // 1. 从原日期删除记录
            if (adminData.calendarEntries[currentDateStr]) {
                adminData.calendarEntries[currentDateStr] = adminData.calendarEntries[currentDateStr]
                    .filter(e => e.id !== entry.id);
                if (adminData.calendarEntries[currentDateStr].length === 0) {
                    delete adminData.calendarEntries[currentDateStr];
                }
            }

            // 2. 从 checkpointCompletions 中删除原日期的记录
            if (adminData.checkpointCompletions[entry.checkpointId]) {
                adminData.checkpointCompletions[entry.checkpointId] =
                    adminData.checkpointCompletions[entry.checkpointId].filter(h =>
                        !(h.date === currentDateStr && h.entryId === entry.id)
                    );
            }

            if (existingEntry) {
                // 覆盖现有记录（保留目标日期的描述，只覆盖标签）
                existingEntry.tags = entry.tags || (entry.tag ? [entry.tag] : []);

                // 确保 checkpointCompletions 中有对应的记录
                if (!adminData.checkpointCompletions[entry.checkpointId]) {
                    adminData.checkpointCompletions[entry.checkpointId] = [];
                }
                const historyRecord = adminData.checkpointCompletions[entry.checkpointId]
                    .find(h => h.date === nextDateStr && h.entryId === existingEntry.id);
                if (!historyRecord) {
                    adminData.checkpointCompletions[entry.checkpointId].push({
                        date: nextDateStr,
                        entryId: existingEntry.id,
                        completed: existingEntry.completed || false
                    });
                }
            } else {
                // 创建新记录（移动原记录的所有数据）
                const movedEntry = {
                    ...entry,
                    date: nextDateStr
                };

                if (!adminData.calendarEntries[nextDateStr]) {
                    adminData.calendarEntries[nextDateStr] = [];
                }
                adminData.calendarEntries[nextDateStr].push(movedEntry);

                // 同步更新 checkpointCompletions
                if (!adminData.checkpointCompletions[entry.checkpointId]) {
                    adminData.checkpointCompletions[entry.checkpointId] = [];
                }
                // 先删除可能存在的旧记录（同一日期）
                adminData.checkpointCompletions[entry.checkpointId] =
                    adminData.checkpointCompletions[entry.checkpointId].filter(h =>
                        !(h.date === nextDateStr && h.entryId === entry.id)
                    );
                // 添加新记录
                adminData.checkpointCompletions[entry.checkpointId].push({
                    date: nextDateStr,
                    entryId: entry.id,
                    completed: entry.completed || false
                });
            }

            saveData();

            // 刷新日历视图
            renderChamberGrid();
            renderScrollArchive();
            updateStats();

            // 显示成功提示
            const btn = document.getElementById('moveNextBtn');
            const originalText = btn.textContent;
            btn.textContent = '✓ 已改期';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 1500);

            // 关闭弹窗
            closeModal();

            moveTempData = null;
        }

        /**
         * 获取检查项的所有标签（从历史记录中收集）
         */
        function getCheckpointTags(checkpointId) {
            const tags = new Set();
            const history = getCheckpointHistory(checkpointId);

            history.forEach(h => {
                const entry = findEntryById(h.date, h.entryId);
                if (entry && entry.tags && Array.isArray(entry.tags)) {
                    entry.tags.forEach(tag => tags.add(tag));
                } else if (entry && entry.tag) {
                    // 兼容旧数据（单标签）
                    tags.add(entry.tag);
                }
            });

            return Array.from(tags).sort();
        }

        // 当前编辑的标签数组
        let currentTags = [];

        /**
         * 渲染标签列表
         */
        function renderTagList() {
            const tagList = document.getElementById('tagList');
            tagList.innerHTML = currentTags.map((tag, index) => `
                <span class="tag-item">
                    ${LifeRPG.security.escapeHtml(tag)}
                    <span class="tag-remove" onclick="removeTag(${index})" title="移除">×</span>
                </span>
            `).join('');
        }

        /**
         * 添加标签
         */
        function addTag(tagName) {
            tagName = tagName.trim();
            if (!tagName) return;
            if (currentTags.includes(tagName)) return;

            currentTags.push(tagName);
            renderTagList();
        }

        /**
         * 移除标签
         */
        function removeTag(index) {
            currentTags.splice(index, 1);
            renderTagList();
        }

        // 当前检查点的可用标签
        let availableTags = [];

        /**
         * 加载检查项标签
         */
        function loadCheckpointTags(checkpointId, entryTags) {
            const tagInput = document.getElementById('tagInput');
            const tagSuggestions = document.getElementById('tagSuggestions');

            // 初始化当前标签数组
            if (entryTags && Array.isArray(entryTags)) {
                currentTags = [...entryTags];
            } else if (entryTags) {
                // 兼容旧数据（单标签字符串）
                currentTags = [entryTags];
            } else {
                currentTags = [];
            }
            renderTagList();

            // 清空输入框
            tagInput.value = '';

            // 加载已有标签选项
            availableTags = getCheckpointTags(checkpointId);

            // 显示标签建议列表的函数
            function showTagSuggestions(filterValue = '') {
                const value = filterValue.trim().toLowerCase();
                
                // 过滤标签（排除已添加的）
                let matches = availableTags.filter(tag =>
                    !currentTags.includes(tag)
                );
                
                // 如果有输入值，则进一步过滤
                if (value) {
                    matches = matches.filter(tag =>
                        tag.toLowerCase().includes(value)
                    );
                }

                if (matches.length > 0) {
                    tagSuggestions.innerHTML = matches.map(tag =>
                        `<div class="tag-suggestion-item" data-tag="${LifeRPG.security.escapeHtml(tag)}">${LifeRPG.security.escapeHtml(tag)}</div>`
                    ).join('');
                    tagSuggestions.classList.add('active');

                    // 绑定点击事件
                    tagSuggestions.querySelectorAll('.tag-suggestion-item').forEach(item => {
                        item.onclick = function() {
                            addTag(this.dataset.tag);
                            tagInput.value = '';
                            tagSuggestions.classList.remove('active');
                        };
                    });
                } else {
                    tagSuggestions.classList.remove('active');
                }
            }

            // 绑定输入事件（显示建议）
            tagInput.oninput = function() {
                showTagSuggestions(this.value);
            };

            // 绑定聚焦事件（点击输入框时显示所有可用标签）
            tagInput.onfocus = function() {
                showTagSuggestions(this.value);
            };

            // 绑定回车事件
            tagInput.onkeydown = function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const activeItem = tagSuggestions.querySelector('.tag-suggestion-item.active');
                    if (activeItem) {
                        addTag(activeItem.dataset.tag);
                    } else if (this.value.trim()) {
                        addTag(this.value);
                    }
                    this.value = '';
                    tagSuggestions.classList.remove('active');
                } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    const items = tagSuggestions.querySelectorAll('.tag-suggestion-item');
                    if (items.length === 0) return;

                    let activeIndex = Array.from(items).findIndex(item => item.classList.contains('active'));
                    if (e.key === 'ArrowDown') {
                        activeIndex = activeIndex < items.length - 1 ? activeIndex + 1 : 0;
                    } else {
                        activeIndex = activeIndex > 0 ? activeIndex - 1 : items.length - 1;
                    }

                    items.forEach(item => item.classList.remove('active'));
                    items[activeIndex].classList.add('active');
                }
            };

            // 点击外部关闭建议
            const clickOutsideHandler = function(e) {
                if (!e.target.closest('.tag-input-wrapper')) {
                    tagSuggestions.classList.remove('active');
                }
            };
            document.addEventListener('click', clickOutsideHandler);

            // 存储处理器引用以便后续清理
            window._tagClickHandler = clickOutsideHandler;
        }

        // ==================== 待办列表功能 ====================

        // 当前待办列表
        let currentTodos = [];

        /**
         * 将待办列表转换为 Markdown 格式
         * @param {Array} todos - [{text: string, completed: boolean}]
         * @returns {string} - Markdown 格式字符串
         */
        function todosToMarkdown(todos) {
            if (!todos || todos.length === 0) return '';
            return todos.map(todo => {
                const checkbox = todo.completed ? '[x]' : '[ ]';
                return `${checkbox} ${todo.text}`;
            }).join('\n');
        }

        /**
         * 从 Markdown 解析待办列表
         * @param {string} markdown - Markdown 格式字符串
         * @returns {Array} - [{text: string, completed: boolean}]
         */
        function markdownToTodos(markdown) {
            if (!markdown || !markdown.trim()) return [];
            const lines = markdown.trim().split('\n');
            return lines.map(line => {
                const completed = line.trim().startsWith('[x]') || line.trim().startsWith('[X]');
                const text = line.replace(/^\[[ xX]\]\s*/, '').trim();
                return { text, completed };
            }).filter(todo => todo.text);
        }

        /**
         * 渲染待办列表
         */
        function renderTodoList() {
            const todoList = document.getElementById('todoList');
            if (!todoList) return;

            todoList.innerHTML = currentTodos.map((todo, index) => `
                <div class="todo-item" data-index="${index}">
                    <div class="todo-checkbox ${todo.completed ? 'checked' : ''}" onclick="toggleTodoItem(${index})">
                        ${todo.completed ? '✓' : ''}
                    </div>
                    <input type="text" class="todo-input ${todo.completed ? 'completed' : ''}" 
                        value="${LifeRPG.security.escapeHtml(todo.text)}" 
                        onchange="updateTodoText(${index}, this.value)"
                        placeholder="输入进展内容...">
                    <div class="todo-delete" onclick="deleteTodoItem(${index})">×</div>
                </div>
            `).join('');

            // 更新隐藏字段的 Markdown 数据
            document.getElementById('todoData').value = todosToMarkdown(currentTodos);
        }

        /**
         * 添加待办项
         */
        function addTodoItem() {
            currentTodos.push({ text: '', completed: false });
            renderTodoList();
            // 聚焦到新添加的输入框
            setTimeout(() => {
                const inputs = document.querySelectorAll('.todo-input');
                if (inputs.length > 0) {
                    inputs[inputs.length - 1].focus();
                }
            }, 0);
        }

        /**
         * 切换待办项完成状态
         */
        function toggleTodoItem(index) {
            if (currentTodos[index]) {
                currentTodos[index].completed = !currentTodos[index].completed;
                renderTodoList();
            }
        }

        /**
         * 更新待办项文本
         */
        function updateTodoText(index, text) {
            if (currentTodos[index]) {
                const trimmed = text.trim();
                const MAX_LENGTH = 500;
                if (trimmed.length > MAX_LENGTH) {
                    showToast('待办内容过长，最多 500 字符', 'warning');
                    return;
                }
                currentTodos[index].text = trimmed;
                document.getElementById('todoData').value = todosToMarkdown(currentTodos);
            }
        }

        /**
         * 删除待办项
         */
        function deleteTodoItem(index) {
            currentTodos.splice(index, 1);
            renderTodoList();
        }

        /**
         * 加载待办列表
         */
        function loadTodos(markdown) {
            if (!markdown || !markdown.trim()) {
                currentTodos = [];
            } else if (markdown.includes('[ ]') || markdown.includes('[x]') || markdown.includes('[X]')) {
                // 新格式：Markdown 待办列表
                currentTodos = markdownToTodos(markdown);
            } else {
                // 旧格式：纯文本，转换为单条未完成的待办
                currentTodos = [{ text: markdown.trim(), completed: false }];
            }
            renderTodoList();
        }

        // ==================== Excel 导出/导入功能 ====================

        /**
         * 导出待办列表到 Excel
         */
        function exportTodosToExcel() {
            const markdown = todosToMarkdown(currentTodos);
            if (!markdown) {
                showToast('没有待办事项可导出', 'warning');
                return;
            }

            // 创建 CSV 内容（Excel 可以直接打开）
            const csvContent = '待办列表\n' + markdown.split('\n').map(line => {
                const completed = line.startsWith('[x]') || line.startsWith('[X]');
                const text = line.replace(/^\[[ xX]\]\s*/, '');
                return `${completed ? '已完成' : '未完成'},"${text.replace(/"/g, '""')}"`;
            }).join('\n');

            // 下载文件
            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `待办列表_${formatDate(new Date())}.csv`;
            link.click();

            showToast('已导出到 Excel', 'success');
        }

        /**
         * 从 Excel 导入待办列表
         */
        function importTodosFromExcel(file) {
            // 验证文件类型
            if (!file.name.endsWith('.csv') && file.type !== 'text/csv' && file.type !== 'application/vnd.ms-excel') {
                showToast('请上传 CSV 文件', 'warning');
                return;
            }

            // 验证文件大小 (限制 1MB)
            const MAX_FILE_SIZE = 1024 * 1024;
            if (file.size > MAX_FILE_SIZE) {
                showToast('文件大小超过 1MB 限制', 'warning');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;

                    // 验证内容长度
                    if (content.length > 100000) {
                        showToast('文件内容过长', 'warning');
                        return;
                    }

                    const lines = content.split('\n').slice(1); // 跳过标题行

                    currentTodos = lines.map(line => {
                        const parts = line.split(',');
                        if (parts.length >= 2) {
                            const completed = parts[0].trim() === '已完成';
                            const text = parts.slice(1).join(',').replace(/^"|"$/g, '').replace(/""/g, '"');
                            return { text, completed };
                        }
                        return null;
                    }).filter(todo => todo && todo.text);

                    // 限制导入数量
                    const MAX_TODOS = 100;
                    if (currentTodos.length > MAX_TODOS) {
                        currentTodos = currentTodos.slice(0, MAX_TODOS);
                        showToast(`待办过多，仅导入前 ${MAX_TODOS} 条`, 'warning');
                    }
