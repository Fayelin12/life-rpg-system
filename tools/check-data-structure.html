<!DOCTYPE html>
<html>
<head><title>检查关卡数据结构</title></head>
<body>
<pre id="output">加载中...</pre>
<script>
const data = JSON.parse(localStorage.getItem('lifeRpgAdminData') || '{}');

// 输出关卡数据结构
let output = '=== 关卡数据结构 ===\n\n';

// 检查 questLevels 的键（任务ID）
output += 'questLevels 的键（任务ID）:\n';
Object.keys(data.questLevels || {}).forEach(questId => {
    const levels = data.questLevels[questId];
    output += `  任务ID: ${questId} (类型: ${typeof questId}) -> ${levels.length} 个关卡\n`;
    levels.forEach(level => {
        output += `    关卡ID: ${level.id} (类型: ${typeof level.id}), 名称: ${level.name}\n`;
        level.checkpoints.forEach(cp => {
            output += `      检查项ID: ${cp.id} (类型: ${typeof cp.id}), 名称: ${cp.name}\n`;
        });
    });
});

// 检查 landmarkQuests 的键（地标ID）
output += '\nlandmarkQuests 的键（地标ID）:\n';
Object.keys(data.landmarkQuests || {}).forEach(lmId => {
    const quests = data.landmarkQuests[lmId];
    output += `  地标ID: ${lmId} (类型: ${typeof lmId}) -> ${quests.length} 个任务\n`;
    quests.forEach(quest => {
        output += `    任务ID: ${quest.id} (类型: ${typeof quest.id}), 名称: ${quest.name}\n`;
    });
});

// 检查 landmarks
output += '\nlandmarks:\n';
(data.landmarks || []).forEach(lm => {
    output += `  地标ID: ${lm.id} (类型: ${typeof lm.id}), 名称: ${lm.name}\n`;
});

document.getElementById('output').textContent = output;
</script>
</body>
</html>
