<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>调试卷轴库渲染</title>
    <style>
        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eae2d6;
            padding: 40px;
            font-size: 13px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #c9a227; text-align: center; }
        .panel {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #c9a227;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .panel h2 {
            color: #c9a227;
            font-size: 16px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(201, 162, 39, 0.3);
        }
        .debug-item {
            background: rgba(201, 162, 39, 0.05);
            border: 1px solid rgba(201, 162, 39, 0.2);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
        }
        .debug-item.shown { border-left: 3px solid #48dbfb; }
        .debug-item.hidden { border-left: 3px solid #ff6b6b; opacity: 0.7; }
        .debug-title { font-weight: bold; color: #c9a227; margin-bottom: 8px; }
        .debug-row { display: flex; gap: 20px; flex-wrap: wrap; margin: 4px 0; }
        .debug-label { color: #8b7765; min-width: 120px; }
        .debug-value { font-family: monospace; }
        .ok { color: #48dbfb; }
        .warn { color: #feca57; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>卷轴库渲染调试</h1>

        <div class="panel">
            <h2>用户服务体验支撑 - 检查项详细状态</h2>
            <div id="debugOutput"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'lifeRpgAdminData';

        function loadData() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        }

        function markdownToTodos(markdown) {
            if (!markdown) return [];
            const lines = markdown.split('\n');
            const todos = [];
            lines.forEach(line => {
                const match = line.match(/^- \[([ xX])\] (.+)$/);
                if (match) {
                    todos.push({
                        text: match[2].trim(),
                        completed: match[1].toLowerCase() === 'x'
                    });
                }
            });
            return todos;
        }

        function debug() {
            const data = loadData();
            const output = document.getElementById('debugOutput');

            // 找到"用户服务体验支撑"关卡
            const questLevels = data.questLevels || {};
            let targetLevel = null;
            let targetQuest = null;
            let targetLandmark = null;

            const landmarks = data.landmarks || [];
            for (const landmark of landmarks) {
                const quests = data.landmarkQuests?.[landmark.id] || [];
                for (const quest of quests) {
                    const levels = questLevels[quest.id] || [];
                    for (const level of levels) {
                        if (level.name === '用户服务体验支撑') {
                            targetLevel = level;
                            targetQuest = quest;
                            targetLandmark = landmark;
                            break;
                        }
                    }
                    if (targetLevel) break;
                }
                if (targetLevel) break;
            }

            if (!targetLevel) {
                output.innerHTML = '<p class="error">找不到"用户服务体验支撑"关卡</p>';
                return;
            }

            let html = '';

            targetLevel.checkpoints.forEach(cp => {
                const cpId = String(cp.id);

                // 模拟 renderScrollArchive 中的逻辑
                const archiveDate = (data.checkpointCompletions?.[cpId] || []).find(h => h.archived)?.date;
                const isArchived = !!archiveDate;
                const history = data.checkpointCompletions?.[cpId] || [];
                const actualDays = history.length;
                const isLevelCompleted = cp.completed === true;

                // 检查待办完成情况
                let isAllTodosCompleted = false;
                let hasUncompletedTodos = false;
                let todoDetails = [];

                if (history.length > 0) {
                    isAllTodosCompleted = history.every(h => {
                        const entries = data.calendarEntries?.[h.date] || [];
                        const entry = entries.find(e => String(e.checkpointId) === cpId);
                        if (entry?.description) {
                            const todos = markdownToTodos(entry.description);
                            const allDone = todos.length > 0 && todos.every(t => t.completed);
                            todoDetails.push({
                                date: h.date,
                                todoCount: todos.length,
                                allDone
                            });
                            return allDone;
                        }
                        return false;
                    });

                    history.forEach(h => {
                        const entries = data.calendarEntries?.[h.date] || [];
                        const entry = entries.find(e => String(e.checkpointId) === cpId);
                        if (entry?.description) {
                            const todos = markdownToTodos(entry.description);
                            if (todos.some(t => !t.completed)) {
                                hasUncompletedTodos = true;
                            }
                        }
                    });
                }

                // 判断是否显示
                let isShown = true;
                let hideReason = '';

                if (isArchived) {
                    isShown = false;
                    hideReason = '已归档';
                } else if (isLevelCompleted || (isAllTodosCompleted && actualDays > 0)) {
                    isShown = false;
                    hideReason = isLevelCompleted ? '关卡已勾选完成' : '所有待办已完成';
                }

                html += `
                    <div class="debug-item ${isShown ? 'shown' : 'hidden'}">
                        <div class="debug-title">${cp.name} (ID: ${cpId})</div>
                        <div class="debug-row">
                            <span class="debug-label">卷轴库显示:</span>
                            <span class="debug-value ${isShown ? 'ok' : 'error'}">${isShown ? '✓ 显示' : '✗ 隐藏'}</span>
                        </div>
                        ${!isShown ? `<div class="debug-row"><span class="debug-label">隐藏原因:</span><span class="debug-value error">${hideReason}</span></div>` : ''}
                        <div class="debug-row">
                            <span class="debug-label">已归档:</span>
                            <span class="debug-value">${isArchived ? '✓ 是' : '✗ 否'} ${archiveDate || ''}</span>
                        </div>
                        <div class="debug-row">
                            <span class="debug-label">关卡勾选:</span>
                            <span class="debug-value">${isLevelCompleted ? '✓ 是' : '✗ 否'} (cp.completed = ${cp.completed})</span>
                        </div>
                        <div class="debug-row">
                            <span class="debug-label">历史记录数:</span>
                            <span class="debug-value">${actualDays} 天</span>
                        </div>
                        <div class="debug-row">
                            <span class="debug-label">所有待办完成:</span>
                            <span class="debug-value">${isAllTodosCompleted ? '✓ 是' : '✗ 否'}</span>
                        </div>
                        <div class="debug-row">
                            <span class="debug-label">有未完成待办:</span>
                            <span class="debug-value">${hasUncompletedTodos ? '✓ 是' : '✗ 否'}</span>
                        </div>
                        ${todoDetails.length > 0 ? `
                            <div class="debug-row">
                                <span class="debug-label">待办详情:</span>
                                <span class="debug-value">${todoDetails.map(d => `${d.date}: ${d.todoCount}条${d.allDone ? '(全完成)' : ''}`).join(', ')}</span>
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            output.innerHTML = html;
        }

        window.onload = debug;
    </script>
</body>
</html>
