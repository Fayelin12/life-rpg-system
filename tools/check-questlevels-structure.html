<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>检查questLevels结构</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a2e; color: #eee; }
        pre { background: #0f0f23; padding: 15px; overflow-x: auto; }
        .section { margin: 20px 0; padding: 15px; background: #16213e; border-radius: 8px; }
        .key { color: #c9a227; }
        .error { color: #ff6b6b; }
    </style>
</head>
<body>
    <h1>检查 questLevels 数据结构</h1>
    <div id="results"></div>
    <script>
        const STORAGE_KEY = 'lifeRpgAdminData';
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

        let html = '<div class="section"><h2>questLevels keys:</h2>';
        const keys = Object.keys(data.questLevels || {});
        html += `<p>共有 ${keys.length} 个 key: [${keys.join(', ')}]</p>`;

        html += '<h2>landmarkQuests keys:</h2>';
        const lqKeys = Object.keys(data.landmarkQuests || {});
        html += `<p>共有 ${lqKeys.length} 个 key: [${lqKeys.join(', ')}]</p>`;

        html += '<h2>landmarks:</h2>';
        html += '<p>' + JSON.stringify(data.landmarks || [], null, 2) + '</p>';

        // 检查 questLevels 的每个 key 对应的内容
        html += '<h2>questLevels 内容:</h2>';
        keys.forEach(key => {
            const levels = data.questLevels[key];
            html += `<h3>Key: <span class="key">${key}</span> (类型: ${typeof key}) - ${levels.length} 个关卡</h3>`;
            levels.forEach(level => {
                html += `<div style="margin-left: 20px;">`;
                html += `<p>level.id: ${level.id} (类型: ${typeof level.id})</p>`;
                html += `<p>level.name: ${level.name}</p>`;
                html += `<p>checkpoints:</p><pre>${JSON.stringify(level.checkpoints || [], null, 2).substring(0, 500)}</pre>`;
                html += `</div>`;
            });
        });

        // 检查 landmarkQuests 的内容
        html += '<h2>landmarkQuests 内容:</h2>';
        lqKeys.forEach(key => {
            const quests = data.landmarkQuests[key];
            html += `<h3>Key: <span class="key">${key}</span> - ${quests.length} 个任务</h3>`;
            quests.forEach(quest => {
                html += `<div style="margin-left: 20px;">`;
                html += `<p>quest.id: ${quest.id} (类型: ${typeof quest.id})</p>`;
                html += `<p>quest.name: ${quest.name}</p>`;
                html += `</div>`;
            });
        });

        document.getElementById('results').innerHTML = html;
    </script>
</body>
</html>
