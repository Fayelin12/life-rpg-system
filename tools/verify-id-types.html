<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>验证ID类型</title>
    <style>
        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eae2d6;
            padding: 40px;
            font-size: 14px;
        }
        h1 { color: #c9a227; text-align: center; }
        .container { max-width: 900px; margin: 0 auto; }
        .panel {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #c9a227;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .ok { color: #48dbfb; }
        .warn { color: #feca57; }
        .error { color: #ff6b6b; }
        pre { background: #0f0f23; padding: 16px; border-radius: 6px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>验证ID类型</h1>
    <div class="container">
        <div class="panel">
            <h2>checkpointCompletions 键类型验证</h2>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const data = JSON.parse(localStorage.getItem('lifeRpgAdminData') || '{}');
        const result = document.getElementById('result');

        let output = '';

        // 检查 checkpointCompletions
        const completions = data.checkpointCompletions || {};
        const keys = Object.keys(completions);

        output += `<p>checkpointCompletions 共有 ${keys.length} 个键</p>`;
        output += '<ul>';

        let allString = true;
        keys.forEach(key => {
            const isString = typeof key === 'string';
            const isNumeric = /^\d+$/.test(key);
            const status = isString ? '<span class="ok">✓ 字符串</span>' : '<span class="error">✗ 非字符串</span>';
            const note = isNumeric ? ' (数字内容)' : '';
            output += `<li>${key}: ${status}${note}</li>`;
            if (!isString) allString = false;
        });

        output += '</ul>';

        if (allString) {
            output += '<p class="ok">✓ 所有键都是字符串类型，数据一致</p>';
        } else {
            output += '<p class="error">✗ 存在非字符串键，需要修复</p>';
        }

        // 显示原始JSON片段
        output += '<h3>原始JSON片段（前500字符）</h3>';
        const jsonStr = JSON.stringify(completions, null, 2);
        output += `<pre>${jsonStr.substring(0, 500)}...</pre>`;

        result.innerHTML = output;
    </script>
</body>
</html>
