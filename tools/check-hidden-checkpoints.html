<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>检查隐藏的检查项</title>
    <style>
        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eae2d6;
            padding: 40px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #c9a227; text-align: center; }
        .panel {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #c9a227;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .panel h2 {
            color: #c9a227;
            font-size: 16px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(201, 162, 39, 0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(201, 162, 39, 0.15);
        }
        th {
            background: rgba(201, 162, 39, 0.1);
            color: #c9a227;
        }
        tr:hover { background: rgba(201, 162, 39, 0.05); }
        .shown { color: #48dbfb; }
        .hidden { color: #ff6b6b; }
        .reason {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        .reason-archived { background: rgba(123, 104, 238, 0.2); color: #b8a8ff; }
        .reason-completed { background: rgba(72, 219, 251, 0.2); color: #48dbfb; }
        .reason-todos { background: rgba(254, 202, 87, 0.2); color: #feca57; }
        .btn {
            background: linear-gradient(135deg, #c9a227 0%, #a88420 100%);
            color: #1a1a2e; border: none; padding: 12px 24px; border-radius: 6px;
            cursor: pointer; font-size: 14px; font-weight: bold; margin: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>检查项显示状态分析</h1>

        <div class="panel">
            <h2>统计</h2>
            <div id="stats"></div>
        </div>

        <div class="panel">
            <h2>所有检查项状态</h2>
            <table>
                <thead>
                    <tr>
                        <th>地标</th>
                        <th>任务</th>
                        <th>关卡</th>
                        <th>检查项</th>
                        <th>ID</th>
                        <th>卷轴库显示</th>
                        <th>隐藏原因</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'lifeRpgAdminData';

        function loadData() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        }

        function getCheckpointHistory(checkpointId, data) {
            return data.checkpointCompletions?.[checkpointId] || [];
        }

        function getCheckpointArchiveDate(checkpointId, data) {
            const history = data.checkpointCompletions?.[checkpointId] || [];
            const archived = history.find(h => h.archived);
            return archived ? archived.date : null;
        }

        function markdownToTodos(markdown) {
            if (!markdown) return [];
            const lines = markdown.split('\n');
            const todos = [];
            lines.forEach(line => {
                const match = line.match(/^- \[([ xX])\] (.+)$/);
                if (match) {
                    todos.push({
                        text: match[2].trim(),
                        completed: match[1].toLowerCase() === 'x'
                    });
                }
            });
            return todos;
        }

        function analyze() {
            const data = loadData();
            const tbody = document.getElementById('tableBody');
            const statsDiv = document.getElementById('stats');

            let total = 0;
            let shown = 0;
            let hidden = 0;
            let archivedCount = 0;
            let completedCount = 0;

            let html = '';

            const landmarks = data.landmarks || [];
            landmarks.forEach(landmark => {
                const quests = data.landmarkQuests?.[landmark.id] || [];
                quests.forEach(quest => {
                    const levels = data.questLevels?.[quest.id] || [];
                    levels.forEach(level => {
                        (level.checkpoints || []).forEach(cp => {
                            total++;

                            const archiveDate = getCheckpointArchiveDate(cp.id, data);
                            const isArchived = !!archiveDate;
                            const history = getCheckpointHistory(cp.id, data);
                            const actualDays = history.length;
                            const isLevelCompleted = cp.completed === true;

                            // 检查是否所有待办都完成
                            let isAllTodosCompleted = false;
                            if (history.length > 0) {
                                isAllTodosCompleted = history.every(h => {
                                    const entries = data.calendarEntries?.[h.date] || [];
                                    const entry = entries.find(e => e.checkpointId === cp.id);
                                    if (entry?.description) {
                                        const todos = markdownToTodos(entry.description);
                                        return todos.length > 0 && todos.every(t => t.completed);
                                    }
                                    return false;
                                });
                            }

                            // 判断是否显示
                            let isShown = true;
                            let reasons = [];

                            if (isArchived) {
                                isShown = false;
                                hidden++;
                                archivedCount++;
                                reasons.push('<span class="reason reason-archived">已归档</span>');
                            } else if (isLevelCompleted || (isAllTodosCompleted && actualDays > 0)) {
                                isShown = false;
                                hidden++;
                                completedCount++;
                                if (isLevelCompleted) {
                                    reasons.push('<span class="reason reason-completed">关卡已勾选</span>');
                                }
                                if (isAllTodosCompleted && actualDays > 0) {
                                    reasons.push('<span class="reason reason-todos">待办全完成</span>');
                                }
                            } else {
                                shown++;
                            }

                            html += `
                                <tr>
                                    <td>${landmark.name}</td>
                                    <td>${quest.name}</td>
                                    <td>${level.name}</td>
                                    <td>${cp.name}</td>
                                    <td style="font-family:monospace;font-size:11px;">${cp.id}</td>
                                    <td class="${isShown ? 'shown' : 'hidden'}">${isShown ? '✓ 显示' : '✗ 隐藏'}</td>
                                    <td>${reasons.join(' ') || '-'}</td>
                                </tr>
                            `;
                        });
                    });
                });
            });

            tbody.innerHTML = html;

            statsDiv.innerHTML = `
                <p>总检查项: <strong>${total}</strong></p>
                <p>卷轴库显示: <strong class="shown">${shown}</strong></p>
                <p>卷轴库隐藏: <strong class="hidden">${hidden}</strong> (已归档: ${archivedCount}, 已完成: ${completedCount})</p>
            `;
        }

        window.onload = analyze;
    </script>
</body>
</html>
