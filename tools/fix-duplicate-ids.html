<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修复重复ID工具 | 人生开放系统</title>
    <link rel="stylesheet" href="common.css">
    <script src="common.js"></script>
    <style>
        body {
            padding: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .header h1 {
            font-family: var(--font-display);
            font-size: 32px;
            color: var(--accent-gold);
            margin-bottom: 10px;
        }
        .header p {
            color: var(--text-secondary);
        }
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .panel h2 {
            font-family: var(--font-display);
            font-size: 18px;
            color: var(--accent-gold);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 20px;
            text-align: center;
        }
        .stat-number {
            font-size: 36px;
            font-weight: 600;
            color: var(--accent-gold);
            margin-bottom: 5px;
        }
        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .duplicate-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .duplicate-item {
            background: var(--bg-deep);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .duplicate-id {
            font-family: monospace;
            font-size: 14px;
            color: var(--accent-ember);
            margin-bottom: 10px;
            padding: 5px 10px;
            background: rgba(212, 99, 78, 0.1);
            border-radius: 4px;
            display: inline-block;
        }
        .duplicate-refs {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.8;
        }
        .duplicate-refs li {
            margin-left: 20px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-family: var(--font-display);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: var(--gradient-gold);
            color: var(--bg-deep);
        }
        .btn-primary:hover {
            box-shadow: 0 0 20px rgba(201, 162, 39, 0.4);
        }
        .btn-danger {
            background: rgba(212, 99, 78, 0.2);
            border: 1px solid var(--accent-ember);
            color: var(--accent-ember);
        }
        .btn-danger:hover {
            background: var(--accent-ember);
            color: var(--bg-deep);
        }
        .action-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid var(--border);
        }
        .success-message {
            background: rgba(74, 155, 139, 0.2);
            border: 1px solid var(--accent-mist);
            color: var(--accent-mist);
            padding: 15px 20px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="bg-texture"></div>

    <div class="header">
        <h1>🔧 修复重复ID工具</h1>
        <p>扫描并修复人生开放系统中的重复ID问题</p>
    </div>

    <div class="panel">
        <h2>📊 扫描结果</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalCheckpoints">0</div>
                <div class="stat-label">检查点总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="uniqueIds">0</div>
                <div class="stat-label">唯一ID数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="duplicateIds" style="color: var(--accent-ember);">0</div>
                <div class="stat-label">重复ID数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="affectedItems" style="color: var(--accent-magic);">0</div>
                <div class="stat-label">受影响项目</div>
            </div>
        </div>

        <div id="duplicateList" class="duplicate-list">
            <div class="empty-state">
                <div class="empty-state-icon">🔍</div>
                <div>点击"扫描重复ID"按钮开始扫描</div>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn btn-primary" onclick="scanDuplicates()">🔍 扫描重复ID</button>
            <button class="btn btn-danger" onclick="fixDuplicates()" id="fixBtn" style="display: none;">🔧 修复重复ID</button>
        </div>

        <div class="success-message" id="successMessage"></div>
    </div>

    <div class="panel">
        <h2>📋 修复说明</h2>
        <div style="color: var(--text-secondary); line-height: 1.8; font-size: 14px;">
            <p><strong>修复范围：</strong></p>
            <ul style="margin-left: 20px; margin-bottom: 15px;">
                <li>关卡中的检查点ID</li>
                <li>日历条目中的 checkpointId 引用</li>
                <li>checkpointCompletions 中的记录</li>
            </ul>
            <p><strong>修复方式：</strong></p>
            <ul style="margin-left: 20px;">
                <li>保留第一个出现的ID</li>
                <li>为重复的检查点生成新的唯一ID</li>
                <li>自动更新所有相关的引用关系</li>
            </ul>
        </div>
    </div>

    <script>
        let adminData = {};
        let duplicateInfo = [];

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 9);
        }

        function loadData() {
            try {
                const saved = LifeRPG.data.load();
                if (saved) {
                    adminData = saved;
                }
            } catch (error) {
                console.error('加载数据失败:', error);
            }
        }

        function scanDuplicates() {
            loadData();
            duplicateInfo = [];

            // 收集所有检查点
            const checkpointMap = new Map(); // id -> [{questId, levelId, checkpoint, location}]
            const questLevels = adminData.questLevels || {};

            Object.keys(questLevels).forEach(questId => {
                const levels = questLevels[questId];
                levels.forEach(level => {
                    if (level.checkpoints) {
                        level.checkpoints.forEach((cp, index) => {
                            if (!checkpointMap.has(cp.id)) {
                                checkpointMap.set(cp.id, []);
                            }
                            checkpointMap.get(cp.id).push({
                                questId,
                                levelId: level.id,
                                levelName: level.name,
                                checkpoint: cp,
                                checkpointIndex: index,
                                location: `关卡「${level.name}」的检查点「${cp.name || '未命名'}」`
                            });
                        });
                    }
                });
            });

            // 找出重复的ID
            const duplicates = [];
            let totalCheckpoints = 0;
            let affectedItems = 0;

            checkpointMap.forEach((refs, id) => {
                totalCheckpoints += refs.length;
                if (refs.length > 1) {
                    duplicates.push({ id, refs });
                    affectedItems += refs.length;
                }
            });

            duplicateInfo = duplicates;

            // 更新统计
            document.getElementById('totalCheckpoints').textContent = totalCheckpoints;
            document.getElementById('uniqueIds').textContent = checkpointMap.size;
            document.getElementById('duplicateIds').textContent = duplicates.length;
            document.getElementById('affectedItems').textContent = affectedItems;

            // 显示列表
            const listContainer = document.getElementById('duplicateList');
            if (duplicates.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">✅</div>
                        <div>未发现重复ID，数据正常！</div>
                    </div>
                `;
                document.getElementById('fixBtn').style.display = 'none';
            } else {
                listContainer.innerHTML = duplicates.map(dup => `
                    <div class="duplicate-item">
                        <div class="duplicate-id">ID: ${dup.id}</div>
                        <div class="duplicate-refs">
                            <div style="margin-bottom: 8px; color: var(--accent-ember);">被 ${dup.refs.length} 个检查点共用：</div>
                            <ul>
                                ${dup.refs.map(ref => `<li>${ref.location}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `).join('');
                document.getElementById('fixBtn').style.display = 'inline-block';
            }

            document.getElementById('successMessage').style.display = 'none';
        }

        function fixDuplicates() {
            if (duplicateInfo.length === 0) {
                alert('没有需要修复的重复ID');
                return;
            }

            if (!confirm(`确定要修复 ${duplicateInfo.length} 个重复ID吗？\n\n修复前建议先备份数据！`)) {
                return;
            }

            let fixedCount = 0;
            const idMapping = new Map(); // oldId -> [{questId, levelId, newId}]

            // 1. 修复 questLevels 中的重复ID
            duplicateInfo.forEach(dup => {
                // 保留第一个，为其他的生成新ID
                dup.refs.forEach((ref, index) => {
                    if (index === 0) {
                        // 保留第一个，记录映射关系
                        if (!idMapping.has(dup.id)) {
                            idMapping.set(dup.id, []);
                        }
                        idMapping.get(dup.id).push({
                            questId: ref.questId,
                            levelId: ref.levelId,
                            newId: dup.id // 第一个保持原ID
                        });
                    } else {
                        // 生成新ID
                        const newId = generateId();
                        ref.checkpoint.id = newId;
                        fixedCount++;

                        // 记录映射关系
                        if (!idMapping.has(dup.id)) {
                            idMapping.set(dup.id, []);
                        }
                        idMapping.get(dup.id).push({
                            questId: ref.questId,
                            levelId: ref.levelId,
                            newId: newId
                        });
                    }
                });
            });

            // 2. 修复 calendarEntries 中的 checkpointId 引用
            const calendarEntries = adminData.calendarEntries || {};
            Object.keys(calendarEntries).forEach(dateStr => {
                const entries = calendarEntries[dateStr];
                entries.forEach(entry => {
                    const oldId = entry.checkpointId;
                    if (idMapping.has(oldId)) {
                        // 找到对应的映射
                        const mappings = idMapping.get(oldId);
                        // 根据 entry 的 levelId 找到正确的映射
                        const mapping = mappings.find(m => m.levelId === entry.levelId);
                        if (mapping && mapping.newId !== oldId) {
                            entry.checkpointId = mapping.newId;
                        }
                    }
                });
            });

            // 3. 修复 checkpointCompletions 中的记录
            const checkpointCompletions = adminData.checkpointCompletions || {};
            const newCompletions = {};

            Object.keys(checkpointCompletions).forEach(oldId => {
                if (idMapping.has(oldId)) {
                    const mappings = idMapping.get(oldId);
                    const completions = checkpointCompletions[oldId];

                    // 为每个新ID分配对应的完成记录
                    mappings.forEach(mapping => {
                        if (mapping.newId === oldId) {
                            // 保留原ID的记录
                            newCompletions[mapping.newId] = completions;
                        } else {
                            // 为新ID创建空记录（或复制相关记录）
                            newCompletions[mapping.newId] = completions.filter(c => {
                                // 根据日期判断这条记录属于哪个检查点
                                // 这里简化处理，复制所有记录
                                return true;
                            });
                        }
                    });
                } else {
                    // 没有重复的ID，直接保留
                    newCompletions[oldId] = checkpointCompletions[oldId];
                }
            });

            adminData.checkpointCompletions = newCompletions;

            // 保存数据
            LifeRPG.data.save(adminData);

            // 显示成功消息
            const msg = document.getElementById('successMessage');
            msg.innerHTML = `
                <strong>✅ 修复成功！</strong><br>
                已修复 ${fixedCount} 个重复的检查点ID，数据已保存。
                <br><br>
                <strong>请刷新页面查看修复结果。</strong>
            `;
            msg.style.display = 'block';

            // 重新扫描
            scanDuplicates();
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });
    </script>
</body>
</html>
