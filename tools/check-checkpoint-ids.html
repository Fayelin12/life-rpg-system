<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>检查检查项ID</title>
    <style>
        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eae2d6;
            padding: 40px;
            min-height: 100vh;
        }
        h1 {
            color: #c9a227;
            text-align: center;
            margin-bottom: 30px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(0,0,0,0.3);
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #c9a227;
        }
        .btn {
            background: linear-gradient(135deg, #c9a227 0%, #a88420 100%);
            color: #1a1a2e;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 5px;
        }
        .error { color: #ff6b6b; }
        .success { color: #48dbfb; }
        .warning { color: #feca57; }
        pre {
            background: #0f0f23;
            padding: 15px;
            overflow-x: auto;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        th {
            background: rgba(201, 162, 39, 0.2);
            color: #c9a227;
        }
        .problem { background: rgba(255, 107, 107, 0.2); }
    </style>
</head>
<body>
    <h1>检查检查项ID</h1>
    <div class="container">
        <div style="text-align: center;">
            <button class="btn" onclick="checkData()">检查数据</button>
        </div>
        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script>
        const STORAGE_KEY = 'lifeRpgAdminData';

        function loadData() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : {};
            } catch (e) {
                console.error('加载数据失败:', e);
                return {};
            }
        }

        function checkData() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';

            const adminData = loadData();
            const questLevels = adminData.questLevels || {};
            const calendarEntries = adminData.calendarEntries || {};

            let html = '<h3>检查结果</h3>';

            // 检查 questLevels 中的检查项ID
            html += '<h4>questLevels 中的检查项ID:</h4>';
            let cpWithEmptyId = 0;
            let cpWithId = 0;

            Object.entries(questLevels).forEach(([questId, levels]) => {
                levels.forEach(level => {
                    const checkpoints = level.checkpoints || [];
                    checkpoints.forEach(cp => {
                        if (!cp.id || cp.id === '') {
                            cpWithEmptyId++;
                            html += `<p class="problem">✗ ${level.name} › ${cp.name || '未命名'} - ID: "${cp.id || 'EMPTY'}"</p>`;
                        } else {
                            cpWithId++;
                        }
                    });
                });
            });

            html += `<p>有ID: ${cpWithId}, 无ID: ${cpWithEmptyId}</p>`;

            // 检查 calendarEntries 中的 checkpointId
            html += '<h4>calendarEntries 中的 checkpointId:</h4>';
            let entryWithEmptyId = 0;
            let entryWithId = 0;

            Object.entries(calendarEntries).forEach(([date, entries]) => {
                entries.forEach(entry => {
                    if (!entry.checkpointId || entry.checkpointId === '') {
                        entryWithEmptyId++;
                        html += `<p class="problem">✗ ${date} - ${entry.checkpointName || '未命名'} - checkpointId: "${entry.checkpointId || 'EMPTY'}"</p>`;
                    } else {
                        entryWithId++;
                    }
                });
            });

            html += `<p>有ID: ${entryWithId}, 无ID: ${entryWithEmptyId}</p>`;

            // 输出原始数据样本
            html += '<h4>questLevels 数据样本:</h4>';
            html += '<pre>' + JSON.stringify(questLevels, null, 2).substring(0, 3000) + '</pre>';

            resultDiv.innerHTML = html;
        }

        window.addEventListener('load', checkData);
    </script>
</body>
</html>
