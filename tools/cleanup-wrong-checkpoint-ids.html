<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>清理错误检查项ID</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eae2d6;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #c9a227; text-align: center; margin-bottom: 30px; }
        .panel {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #c9a227;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .panel h2 {
            color: #c9a227;
            font-size: 16px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(201, 162, 39, 0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(201, 162, 39, 0.15);
        }
        th {
            background: rgba(201, 162, 39, 0.1);
            color: #c9a227;
        }
        tr:hover { background: rgba(201, 162, 39, 0.05); }
        .wrong-id { color: #ff6b6b; font-family: monospace; }
        .correct-id { color: #48dbfb; font-family: monospace; }
        .btn {
            background: linear-gradient(135deg, #c9a227 0%, #a88420 100%);
            color: #1a1a2e; border: none; padding: 12px 24px; border-radius: 6px;
            cursor: pointer; font-size: 14px; font-weight: bold; margin: 5px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(201, 162, 39, 0.4); }
        .btn-danger { background: linear-gradient(135deg, #d4634e 0%, #b8543e 100%); }
        .btn-success { background: linear-gradient(135deg, #48dbfb 0%, #0abde3 100%); }
        .log {
            background: #0f0f23; padding: 16px; border-radius: 6px;
            font-size: 12px; max-height: 400px; overflow-y: auto; margin-top: 16px;
        }
        .log-item { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .log-item.success { color: #48dbfb; }
        .log-item.warning { color: #feca57; }
        .log-item.error { color: #ff6b6b; }
        .log-item.info { color: #8b7765; }
        .hidden { display: none; }
        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(201, 162, 39, 0.05);
            border: 1px solid rgba(201, 162, 39, 0.3);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }
        .stat-number { font-size: 32px; font-weight: bold; color: #c9a227; }
        .stat-label { font-size: 12px; color: #8b7765; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>清理错误检查项ID</h1>

        <div class="panel">
            <h2>检测原理</h2>
            <p>遍历所有日历记录，检查每个 checkpointId 是否存在于关卡数据中：</p>
            <ol style="margin: 12px 0 12px 24px; line-height: 1.8;">
                <li>如果 checkpointId 在关卡数据中找不到 → 错误ID</li>
                <li>通过检查项名称在关卡数据中查找正确ID</li>
                <li>同时修复 calendarEntries 和 checkpointCompletions</li>
            </ol>
        </div>

        <div class="panel">
            <h2>检测结果</h2>
            <div class="summary" id="summary">
                <div class="stat-card">
                    <div class="stat-number" id="totalEntries">-</div>
                    <div class="stat-label">日历记录总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="wrongEntries">-</div>
                    <div class="stat-label">错误ID数量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="correctEntries">-</div>
                    <div class="stat-label">正确ID数量</div>
                </div>
            </div>
        </div>

        <div class="panel">
            <h2>需要修复的记录</h2>
            <div id="wrongList">
                <table>
                    <thead>
                        <tr>
                            <th>日期</th>
                            <th>条目ID</th>
                            <th>错误的checkpointId</th>
                            <th>正确的checkpointId</th>
                            <th>检查项名称</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="wrongTableBody"></tbody>
                </table>
            </div>
        </div>

        <div class="panel">
            <h2>操作</h2>
            <button class="btn" onclick="analyzeData()">检测数据</button>
            <button class="btn btn-success" onclick="fixData()" id="fixBtn" style="display:none;">执行修复</button>
            <button class="btn btn-danger" onclick="backupData()" id="backupBtn" style="display:none;">备份数据</button>
        </div>

        <div class="panel hidden" id="logPanel">
            <h2>执行日志</h2>
            <div class="log" id="log"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'lifeRpgAdminData';
        let adminData = null;
        let entriesToFix = [];
        let validCheckpointIds = new Set();

        function loadData() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(adminData));
        }

        function addLog(msg, type = 'info') {
            const log = document.getElementById('log');
            const item = document.createElement('div');
            item.className = `log-item ${type}`;
            item.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            log.appendChild(item);
            log.scrollTop = log.scrollHeight;
        }

        // 收集所有有效的检查项ID（从关卡数据中）
        function collectValidCheckpointIds() {
            validCheckpointIds.clear();
            const questLevels = adminData.questLevels || {};
            Object.values(questLevels).forEach(levels => {
                levels.forEach(level => {
                    (level.checkpoints || []).forEach(cp => {
                        if (cp.id) validCheckpointIds.add(String(cp.id));
                    });
                });
            });
            addLog(`收集到 ${validCheckpointIds.size} 个有效的检查项ID`, 'success');
        }

        // 通过名称查找正确的检查项ID
        function findCorrectCheckpointId(name) {
            const questLevels = adminData.questLevels || {};
            for (const levels of Object.values(questLevels)) {
                for (const level of levels) {
                    const cp = (level.checkpoints || []).find(c => c.name === name);
                    if (cp) return String(cp.id);
                }
            }
            return null;
        }

        function analyzeData() {
            adminData = loadData();
            if (!adminData.calendarEntries) {
                alert('无日历数据');
                return;
            }

            document.getElementById('logPanel').classList.remove('hidden');
            addLog('开始检测...', 'warning');

            // 收集有效ID
            collectValidCheckpointIds();

            entriesToFix = [];
            let totalEntries = 0;

            // 遍历所有日历记录
            Object.entries(adminData.calendarEntries || {}).forEach(([date, entries]) => {
                entries.forEach(entry => {
                    totalEntries++;
                    const cpId = String(entry.checkpointId);

                    // 检查是否是有效ID
                    if (!validCheckpointIds.has(cpId)) {
                        // 查找正确ID
                        const correctId = findCorrectCheckpointId(entry.checkpointName);
                        if (correctId) {
                            entriesToFix.push({
                                date,
                                entryId: entry.id,
                                wrongId: cpId,
                                correctId,
                                name: entry.checkpointName
                            });
                        } else {
                            addLog(`⚠️  ${date}: "${entry.checkpointName}" 在关卡数据中找不到 (ID: ${cpId})`, 'warning');
                        }
                    }
                });
            });

            // 更新统计
            document.getElementById('totalEntries').textContent = totalEntries;
            document.getElementById('wrongEntries').textContent = entriesToFix.length;
            document.getElementById('correctEntries').textContent = totalEntries - entriesToFix.length;

            // 显示需要修复的记录
            const tbody = document.getElementById('wrongTableBody');
            tbody.innerHTML = '';

            if (entriesToFix.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#48dbfb;">所有检查项ID都正确，无需修复</td></tr>';
            } else {
                entriesToFix.forEach((item, idx) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.date}</td>
                        <td>${item.entryId}</td>
                        <td class="wrong-id">${item.wrongId}</td>
                        <td class="correct-id">${item.correctId}</td>
                        <td>${item.name}</td>
                        <td id="status-${idx}">待修复</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            // 显示操作按钮
            document.getElementById('fixBtn').style.display = entriesToFix.length > 0 ? 'inline-block' : 'none';
            document.getElementById('backupBtn').style.display = entriesToFix.length > 0 ? 'inline-block' : 'none';

            addLog(`检测完成：共 ${totalEntries} 条记录，${entriesToFix.length} 条需要修复`, entriesToFix.length > 0 ? 'warning' : 'success');
        }

        function backupData() {
            const backup = JSON.stringify(adminData, null, 2);
            const blob = new Blob([backup], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `lifeRpgBackup_${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            addLog('数据备份已下载', 'success');
        }

        function fixData() {
            if (!confirm(`确认要修复 ${entriesToFix.length} 条记录吗？\n\n修复前建议先备份数据！`)) {
                return;
            }

            addLog('开始修复...', 'warning');

            let fixedCount = 0;
            let errorCount = 0;

            entriesToFix.forEach((item, idx) => {
                try {
                    const entries = adminData.calendarEntries[item.date];
                    if (!entries) {
                        addLog(`${item.date}: 日期记录不存在`, 'error');
                        errorCount++;
                        return;
                    }

                    const entry = entries.find(e => e.id === item.entryId);
                    if (!entry) {
                        addLog(`${item.date}: 条目 ${item.entryId} 不存在`, 'error');
                        errorCount++;
                        return;
                    }

                    // 修复 calendarEntries 中的 checkpointId
                    const oldId = entry.checkpointId;
                    entry.checkpointId = item.correctId;

                    // 修复 checkpointCompletions
                    if (adminData.checkpointCompletions) {
                        // 确保正确ID的数组存在
                        if (!adminData.checkpointCompletions[item.correctId]) {
                            adminData.checkpointCompletions[item.correctId] = [];
                        }

                        // 从错误ID迁移记录
                        const oldCompletions = adminData.checkpointCompletions[oldId] || [];
                        const targetEntry = oldCompletions.find(c => c.entryId === item.entryId);

                        if (targetEntry) {
                            adminData.checkpointCompletions[item.correctId].push(targetEntry);
                            const removeIdx = oldCompletions.indexOf(targetEntry);
                            if (removeIdx > -1) oldCompletions.splice(removeIdx, 1);

                            // 清理空数组
                            if (oldCompletions.length === 0) {
                                delete adminData.checkpointCompletions[oldId];
                            }
                        }
                    }

                    // 更新状态显示
                    const statusCell = document.getElementById(`status-${idx}`);
                    if (statusCell) {
                        statusCell.textContent = '已修复';
                        statusCell.style.color = '#48dbfb';
                    }

                    addLog(`${item.date}: ${item.name} - ${oldId} → ${item.correctId}`, 'success');
                    fixedCount++;
                } catch (e) {
                    addLog(`${item.date}: 修复失败 - ${e.message}`, 'error');
                    errorCount++;
                }
            });

            // 保存数据
            if (fixedCount > 0) {
                if (saveData()) {
                    addLog(`修复完成！成功: ${fixedCount}, 失败: ${errorCount}`, 'success');
                    alert(`修复完成！\n成功: ${fixedCount} 条\n失败: ${errorCount} 条`);
                } else {
                    addLog('保存数据失败！', 'error');
                    alert('保存数据失败！');
                }
            }
        }

        // 页面加载时自动检测
        window.onload = analyzeData;
    </script>
</body>
</html>
